<style>/* VOICE: un genio gentile e teatrale che insegna l'italiano con meraviglia, mai con fretta.
   IDEA: la torre di un mago di notte; ogni attività è un incantesimo e ogni risposta una scintilla.
   PICTURE: vetrate gotiche con la luna, candele sospese, pergamene miniate, oro su indaco profondo.
   COLOUR and TYPE: indaco notte, oro antico, pergamena e inchiostro; Grenze Gotisch per i titoli, Alegreya per la pergamena, Alegreya Sans per l'interfaccia.
   LAYOUT: il Genio vive in una colonna (a sinistra su schermi larghi, in alto sul telefono) e il pannello delle attività occupa il resto. */
:root{--ink:#3b2412;--ink2:#6a4a2a;--par:#f6ead0;--par2:#e9d4a6;--gold:#e8c15a;--gold2:#b8862b;--gold3:#8a5d17;--ind:#0e0a24;--ind2:#171139;--pur:#2a1650;--lap:#1f3a93;--ver:#c8402a;--eme:#2f9e6e;--cy:#6fe3ff;
 --txt:#f4eeff;--mut:#c3b8e4;--sat:env(safe-area-inset-top,0px);--top:calc(60px + var(--sat));--r:16px;--ft:'Grenze Gotisch',Georgia,'Times New Roman',serif;--fb:'Alegreya',Georgia,serif;--fs:'Alegreya Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--gap:clamp(10px,1.2vw,18px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--ind);color:var(--txt);font-family:var(--fs);font-size:16px;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px;border-radius:8px}
.ic{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em}
#scene{position:fixed;inset:-24px;z-index:0;will-change:transform;transition:transform .6s cubic-bezier(.2,.7,.2,1);contain:strict}#bg{width:100%;height:100%;display:block}
#amb{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sky1{stop-color:#0b1440}.sky2{stop-color:#3a2470}
body[data-atmo=aurora] .sky1{stop-color:#03101e}body[data-atmo=aurora] .sky2{stop-color:#0e3a4c}
body[data-atmo=tramonto] .sky1{stop-color:#2a1650}body[data-atmo=tramonto] .sky2{stop-color:#e8823e}
.aur,.sun{display:none}body[data-atmo=aurora] .aur{display:inline}body[data-atmo=tramonto] .sun{display:inline}body[data-atmo=tramonto] .moon{display:none}
body[data-atmo=tramonto] #bg .stars{opacity:.35}
#bg .stars circle{fill:#fff}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#g2d{position:fixed;z-index:2;display:none;pointer-events:none;filter:drop-shadow(0 0 18px rgba(111,227,255,.45));animation:g2f 4s ease-in-out infinite}
body.no3d #g2d{display:block}body.no3d #gl{display:none}
@keyframes g2f{50%{translate:0 -10px}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}
#ui{position:fixed;inset:0;z-index:5;pointer-events:none}
#ui>*{pointer-events:auto}
/* ---------- barra superiore ---------- */
#top{position:absolute;left:0;right:0;top:0;height:var(--top);display:flex;align-items:center;gap:8px;padding:var(--sat) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));
 background:linear-gradient(180deg,rgba(8,5,24,.92),rgba(8,5,24,.55) 70%,rgba(8,5,24,0));z-index:3}
#ttl{flex:1;margin:0;font:700 clamp(18px,1.6vw + 8px,28px)/1 var(--ft);letter-spacing:.02em;color:var(--gold);text-shadow:0 2px 0 #3a2105,0 0 18px rgba(232,193,90,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:44px;height:44px;border-radius:12px;border:1px solid rgba(232,193,90,.28);background:rgba(30,20,70,.55);color:var(--gold);padding:0 10px}
.tb:hover{background:rgba(60,40,120,.7)}.tb.off{color:#7d7399;border-color:rgba(255,255,255,.1)}.tb.off .ic{opacity:.6}
.brand{background:none;border:none;padding:0 6px}.brand .bt{font:700 20px var(--ft);color:var(--gold);white-space:nowrap}
body:not([data-scr=hub]) .brand .bt{display:none}body[data-scr=hub] #ttl{visibility:hidden}
.stats{display:flex;align-items:center;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:999px;border:1px solid rgba(232,193,90,.35);background:rgba(20,12,50,.65);color:#fff3c9;font-weight:800}
.chip .ic{color:var(--gold)}#strc .ic{color:#ff9a4a}
.chip.pulse{animation:pulse .6s}@keyframes pulse{40%{transform:scale(1.18);box-shadow:0 0 22px var(--gold)}}
.chip.lv{position:relative;overflow:hidden;padding:0 14px;min-width:74px}.lvc{position:relative;z-index:1}
#lvbar{position:absolute;left:0;bottom:0;height:4px;width:var(--p,0%);background:linear-gradient(90deg,var(--gold2),var(--gold),#fff3c4);box-shadow:0 0 8px var(--gold)}
/* ---------- colonna del Genio ---------- */
#gcol{position:absolute;display:flex;flex-direction:column;gap:10px;pointer-events:none;transition:all .55s cubic-bezier(.2,.7,.2,1)}
#gcol>*{pointer-events:auto}
#gslot{flex:1;min-height:80px;position:relative;pointer-events:none}
#ghot{position:absolute;left:28%;top:6%;width:44%;height:34%;border:0;background:transparent;pointer-events:auto;border-radius:40%}
#eslot{position:absolute;pointer-events:none;display:none}
#bubble{position:relative;flex:none;max-height:40%;overflow:auto;background:radial-gradient(120% 90% at 20% 0%,#fff8e4,transparent 60%),linear-gradient(180deg,#f7ecd2,#ead3a3);color:var(--ink);
 border:2px solid #caa35a;border-radius:16px;padding:12px 16px 10px;box-shadow:0 10px 26px rgba(0,0,0,.45),inset 0 0 22px rgba(160,110,40,.25);font:500 clamp(15px,.55vw + 12px,20px)/1.38 var(--fb);
 opacity:0;transform:translateY(-6px) scale(.98);transition:opacity .35s,transform .35s;scrollbar-width:thin}
#bubble.on{opacity:1;transform:none}
#bubble .bin{padding-right:34px}.btxt{margin:0}.btxt::first-letter{font:700 1.85em/0.8 var(--ft);color:#8a1f1f;float:left;margin:4px 6px 0 0;text-shadow:0 1px 0 #e8c15a}
.ben{display:none;margin:6px 0 0;font:italic 500 .9em var(--fb);color:#6a4a2a;border-top:1px dashed #c9a35a;padding-top:6px}.ben.open{display:block}
.bbtn{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:4px}
.mini{width:32px;height:32px;border-radius:9px;border:1px solid #c9a35a;background:#fff4d6;color:#7a4a12;display:inline-flex;align-items:center;justify-content:center;padding:0}
#bubble:not(.hasen) .btrans{display:none}
/* ---------- pannello principale ---------- */
.main{position:absolute;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--gold2) transparent;padding:2px 4px 24px}
.main::-webkit-scrollbar{width:8px}.main::-webkit-scrollbar-thumb{background:var(--gold2);border-radius:8px}
.card{background:linear-gradient(180deg,rgba(30,21,70,.93),rgba(15,10,40,.95));border:1px solid rgba(232,193,90,.32);border-radius:var(--r);padding:clamp(12px,1.4vw,22px);
 box-shadow:0 12px 32px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.07)}
.card+.card,.card+.row,.row+.card{margin-top:var(--gap)}
.parch{background:radial-gradient(140% 100% at 15% 0%,#fffaea 0,transparent 55%),radial-gradient(120% 120% at 100% 100%,rgba(190,140,60,.25),transparent 60%),linear-gradient(180deg,#f8eed6,#ecd8ab);
 color:var(--ink);border:2px solid #c9a35a;border-radius:16px;box-shadow:0 14px 34px rgba(0,0,0,.45),inset 0 0 0 4px rgba(255,248,225,.5),inset 0 0 30px rgba(150,100,30,.22)}
h2,h3{font-family:var(--ft);font-weight:700;letter-spacing:.01em;margin:0 0 10px;color:var(--gold)}
h2{font-size:clamp(24px,1.4vw + 14px,36px)}h3{font-size:clamp(19px,.8vw + 13px,26px)}
.parch h2,.parch h3{color:#7a1f1f}
p{line-height:1.5;margin:0 0 10px}small,.mut{color:var(--mut)}.parch .mut{color:#7a5a3a}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row.c{justify-content:center}.row.sb{justify-content:space-between}.row.end{justify-content:flex-end}
.grid{display:grid;gap:var(--gap)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:1px solid rgba(232,193,90,.45);
 background:linear-gradient(180deg,rgba(70,48,140,.75),rgba(40,26,90,.85));color:#fff5d6;font-weight:700;font-size:16px;letter-spacing:.01em;box-shadow:0 4px 14px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.12);transition:transform .12s,box-shadow .2s,filter .2s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 22px rgba(0,0,0,.35),0 0 18px rgba(232,193,90,.25)}
.btn:active:not(:disabled){transform:translateY(1px)}.btn:disabled{opacity:.5;filter:grayscale(.4)}
.btn.gold{background:linear-gradient(180deg,#fff0b8,#e8c15a 45%,#b8862b);color:#3a2105;border-color:#fff1bf;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.btn.ghost{background:rgba(255,255,255,.04)}.parch .btn.ghost{color:var(--ink);border-color:#c9a35a;background:rgba(255,250,235,.6)}
.btn.red{background:linear-gradient(180deg,#e0604a,#9a2a1a);border-color:#ffb3a3}
.btn.green{background:linear-gradient(180deg,#43c08a,#1f7a52);border-color:#a8f0cc}
.btn.big{min-height:58px;font-size:19px;padding:12px 26px;border-radius:16px}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(232,193,90,.14);border:1px solid rgba(232,193,90,.35);color:#ffe7a6;font-size:14px;font-weight:700}
.parch .pill{background:rgba(138,93,23,.12);color:#6a3a10;border-color:#c9a35a}
.seg{display:inline-flex;border:1px solid rgba(232,193,90,.4);border-radius:12px;overflow:hidden;flex-wrap:wrap}
.seg button{min-height:42px;padding:6px 14px;border:0;background:rgba(30,20,70,.6);color:#e9e0ff;font-weight:700}
.seg button.on{background:linear-gradient(180deg,#fff0b8,#e8c15a 50%,#b8862b);color:#3a2105}
.parch .seg button{background:#fff7e2;color:var(--ink)}.parch .seg button.on{background:linear-gradient(180deg,#fff0b8,#e8c15a 50%,#b8862b)}
.note{padding:10px 12px;border-radius:12px;background:rgba(111,227,255,.08);border:1px solid rgba(111,227,255,.3);color:#d8f6ff;font-size:15px}
.parch .note{background:rgba(31,58,147,.08);border-color:rgba(31,58,147,.25);color:#1f2a5a}
.bar{height:12px;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden;border:1px solid rgba(255,255,255,.1)}.bar i{display:block;height:100%;width:var(--p,0%);background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .5s}
.parch .bar{background:rgba(120,80,30,.18)}
/* ---------- domande ---------- */
.q{padding:clamp(14px,1.6vw,26px);display:flex;flex-direction:column;gap:14px;position:relative}
.qtop{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline;justify-content:space-between}
.qskill{font:700 13px var(--fs);letter-spacing:.14em;text-transform:uppercase;color:#8a5d17}
.qsub{font:italic 500 16px var(--fb);color:#6a4a2a}
.qtime{flex-basis:100%;height:7px;border-radius:9px;background:rgba(120,80,30,.2);overflow:hidden}.qtime i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#c8402a,#e8c15a);transform-origin:left}
.qpic{font-size:clamp(64px,5vw + 30px,108px);line-height:1;text-align:center;filter:drop-shadow(0 6px 10px rgba(80,40,0,.3));animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.qprompt{font:500 clamp(21px,1vw + 15px,32px)/1.35 var(--fb);text-align:center;color:var(--ink)}
.qprompt .big{font-weight:700;font-size:1.15em}.qprompt .num{font-family:var(--ft);font-size:1.8em;color:#7a1f1f}
.qprompt .hint{color:#8a5d17;font-style:italic;font-size:.85em}.qprompt .pers{font-weight:700;color:#5b2a92}
.qprompt .ctx{display:block;font:700 13px var(--fs);letter-spacing:.14em;text-transform:uppercase;color:#8a5d17;margin-bottom:6px}.qprompt .line{display:block}
.qprompt .riddle{font-style:italic}.qprompt .en{font-style:italic;color:#5a4a7a}
.gap{display:inline-block;min-width:2.6em;border-bottom:3px dotted var(--gold2);color:transparent;line-height:1}
.clock{width:min(170px,40vw);height:auto;display:block;margin:0 auto;filter:drop-shadow(0 6px 10px rgba(80,40,0,.3))}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.opts.n2{grid-template-columns:1fr 1fr}.opts.pics .opt span{font-size:52px;line-height:1}
.opt{position:relative;min-height:56px;padding:12px 14px 12px 40px;border-radius:12px;border:2px solid #d9bd7a;background:linear-gradient(180deg,#fffaf0,#f6e8c8);color:var(--ink);font:600 clamp(17px,.5vw + 14px,22px)/1.25 var(--fb);text-align:left;
 box-shadow:0 3px 0 #c9a35a;transition:transform .1s,box-shadow .2s,border-color .2s}
.opt kbd{position:absolute;left:10px;top:50%;transform:translateY(-50%);font:700 12px var(--fs);width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:#ecd7a8;color:#7a5a2a}
.opt:hover:not(:disabled){border-color:var(--gold2);box-shadow:0 3px 0 #b8862b,0 0 0 4px rgba(232,193,90,.28)}
.opt.ok{border-color:#2f9e6e;background:linear-gradient(180deg,#e8fff2,#bfeed6);box-shadow:0 3px 0 #2f9e6e,0 0 18px rgba(47,158,110,.45)}
.opt.ko{border-color:#c8402a;background:linear-gradient(180deg,#fff0ec,#f5c8bc);box-shadow:0 3px 0 #c8402a}
.opt:disabled:not(.ok):not(.ko){opacity:.6}
.typ{display:flex;gap:10px}.inp{flex:1;min-width:0;min-height:54px;padding:10px 14px;border-radius:12px;border:2px solid #c9a35a;background:#fffdf6;color:var(--ink);font:600 22px var(--fb)}
.inp:focus{outline:none;border-color:var(--gold2);box-shadow:0 0 0 4px rgba(232,193,90,.35)}
.acc{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.key{min-width:44px;min-height:44px;border-radius:10px;border:1px solid #c9a35a;background:#fff4d6;color:#6a3a10;font:700 20px var(--fb)}.key.wide{font:700 14px var(--fs);padding:0 12px}
.slots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.slot{width:44px;height:52px;border-radius:10px;border:2px dashed #c9a35a;display:grid;place-items:center;font:700 26px var(--ft);color:#5b2a92;background:rgba(255,255,255,.4)}
.slot.f{border-style:solid;background:#fff;animation:pop .25s}
.runes{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.rune{width:52px;height:56px;border-radius:12px;border:2px solid #6b5a8a;background:linear-gradient(180deg,#5a4a7a,#2e2350);color:#e8f8ff;font:700 26px var(--ft);
 box-shadow:0 4px 0 #1d1538,0 0 14px rgba(111,227,255,.35);text-shadow:0 0 10px var(--cy)}.rune:disabled{opacity:.25;box-shadow:none}
.oline{min-height:64px;padding:10px;border-radius:12px;border:2px dashed #c9a35a;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:rgba(255,255,255,.35)}.oline .ph{color:#9a7a4a;font-style:italic}
.opool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:50px}
.tok{min-height:44px;padding:6px 14px;border-radius:999px;border:2px solid #b98cff;background:linear-gradient(180deg,#f3ebff,#dccbff);color:#3a1a62;font:600 19px var(--fb);box-shadow:0 3px 0 #8a6ac0;animation:pop .25s}
.tok.in{border-color:#c9a35a;background:#fffaf0;color:var(--ink);box-shadow:0 3px 0 #c9a35a}.tok.okt{border-color:#2f9e6e;background:#dff7ea}.tok.kot{border-color:#c8402a;background:#fde2dc}
.tapline{font:500 clamp(20px,.8vw + 15px,28px)/2 var(--fb);text-align:center}.tw{border:0;background:none;padding:2px 6px;border-radius:8px;color:var(--ink);font:inherit;border-bottom:2px dotted #c9a35a}
.tw:hover{background:rgba(232,193,90,.25)}.tw.ok{background:#bfeed6}.tw.ko{background:#f5c8bc;text-decoration:line-through}
.qfb{min-height:0}.fb{display:flex;align-items:center;gap:8px;font:700 22px var(--ft);justify-content:center}.fb.ok{color:#1f7a52}.fb.ko{color:#a8321f}
.fbfull{text-align:center;font:500 19px var(--fb);margin-top:4px}.fbn,.fbexp{text-align:center;font:italic 16px var(--fb);color:#6a4a2a;margin-top:6px}
.q.right{animation:glowok .8s}.q.wrong{animation:glowko .6s}
@keyframes glowok{30%{box-shadow:0 0 0 6px rgba(47,158,110,.45),0 14px 34px rgba(0,0,0,.45)}}@keyframes glowko{30%{box-shadow:0 0 0 6px rgba(200,64,42,.45),0 14px 34px rgba(0,0,0,.45)}}
.listen.big{align-self:center;min-height:70px;padding:12px 30px;font-size:20px}
/* ---------- mappa delle attività ---------- */
.hello{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.hello .who{display:flex;align-items:center;gap:12px}.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff0b8,#e8c15a 50%,#8a5d17);color:#3a2105;font:700 24px var(--ft);box-shadow:0 0 18px rgba(232,193,90,.5)}
.who b{font:700 22px var(--ft);color:var(--gold)}.mis{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-top:12px}
.misi{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(232,193,90,.2);font-size:14px}.misi.done{border-color:#2f9e6e;background:rgba(47,158,110,.12)}
.misi .bar{height:7px;margin-top:6px}
.sect{margin-top:calc(var(--gap)*1.4)}.sect>h3{display:flex;align-items:center;gap:10px}.sect>h3::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(232,193,90,.6),transparent)}
.tiles{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.tile{position:relative;text-align:left;display:flex;flex-direction:column;gap:6px;padding:16px;min-height:150px;border-radius:18px;border:1px solid rgba(232,193,90,.32);
 background:radial-gradient(120% 80% at 100% 0%,var(--tc,rgba(111,227,255,.18)),transparent 60%),linear-gradient(180deg,rgba(36,26,84,.86),rgba(18,12,46,.9));box-shadow:0 10px 26px rgba(0,0,0,.35);transition:transform .2s,box-shadow .2s;overflow:hidden}
.tile:hover{transform:translateY(-4px);box-shadow:0 16px 34px rgba(0,0,0,.45),0 0 24px var(--tc,rgba(111,227,255,.3))}
.tile .em{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff3c4,#e8c15a 45%,#8a5d17);color:#2a1503;box-shadow:0 0 0 3px rgba(255,240,190,.25),0 6px 14px rgba(0,0,0,.4)}
.tile .em .ic{width:28px;height:28px;stroke-width:2}
.tile b{font:700 22px/1.05 var(--ft);color:#fff1c4}.tile span{font-size:14.5px;color:var(--mut);line-height:1.35}.tile .tag{position:absolute;right:12px;top:12px}
.tile::after{content:'';position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.08) 50%,transparent 60%);transform:translateX(-100%);transition:transform .8s}.tile:hover::after{transform:translateX(100%)}
/* ---------- duello ---------- */
.hud{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.hp{display:flex;flex-direction:column;gap:4px}.hp .nm{font:700 18px var(--ft);color:#ffe9a8}.hp .bar{height:16px}.hp .bar i{background:linear-gradient(90deg,#2f9e6e,#7cf0b0)}.hp.e .bar i{background:linear-gradient(90deg,#c8402a,#ff9a6a)}
.hp.e{text-align:right}.hp .sub{font-size:13px;color:var(--mut)}.vs{font:700 26px var(--ft);color:var(--gold)}
.spells{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.spell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border-radius:14px;border:1px solid rgba(232,193,90,.4);background:linear-gradient(180deg,rgba(60,40,130,.8),rgba(30,20,70,.9));color:#fff;min-height:96px}
.spell .ic{width:30px;height:30px;color:var(--cy)}.spell b{font:700 18px var(--ft)}.spell small{font-size:12.5px;color:var(--mut)}.spell:disabled{opacity:.4}
.spell.s1 .ic{color:#ffe17a}.spell.s3 .ic{color:#7cf0b0}.spell.s4 .ic{color:#9ad8ff}
.mapw{position:relative;padding:8px}.camp{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:16px;border:1px solid rgba(232,193,90,.3);background:rgba(20,12,50,.7);text-align:center}
.node .med{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:radial-gradient(circle at 35% 30%,var(--c2),var(--c1));box-shadow:0 0 0 3px rgba(232,193,90,.5),0 0 18px var(--c1)}
.node b{font:700 16px/1.1 var(--ft);color:#fff1c4}.node small{font-size:12.5px}.node.lock{opacity:.45}.node .stars{color:var(--gold);letter-spacing:2px}
.dmg{position:absolute}
/* ---------- genio indovino ---------- */
.answers{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.ans{min-height:56px;border-radius:14px;border:2px solid rgba(232,193,90,.5);background:linear-gradient(180deg,rgba(70,48,140,.85),rgba(40,26,90,.9));color:#fff;font:700 18px var(--fs)}
.ans.y{border-color:#7cf0b0}.ans.n{border-color:#ff9a8a}.ans:hover{filter:brightness(1.15)}
.akiq{font:500 clamp(24px,1.2vw + 16px,36px)/1.3 var(--fb);text-align:center;color:var(--ink)}.akin{font:700 13px var(--fs);letter-spacing:.14em;text-transform:uppercase;color:#8a5d17;text-align:center}
.guess{text-align:center}.guess .qpic{font-size:110px}.guess .w{font:700 clamp(34px,2vw + 20px,52px) var(--ft);color:#7a1f1f}
.qlist{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));max-height:42vh;overflow:auto;padding:4px}
.qbtn{min-height:44px;text-align:left;padding:8px 12px;border-radius:10px;border:1px solid #c9a35a;background:#fff8e6;color:var(--ink);font:500 16px var(--fb)}.qbtn:disabled{opacity:.45}
.log{display:flex;flex-direction:column;gap:6px;max-height:30vh;overflow:auto}.log div{padding:6px 10px;border-radius:10px;background:rgba(120,80,30,.1);font:500 15px var(--fb)}.log .y{color:#1f7a52}.log .n{color:#a8321f}
/* ---------- torre ---------- */
.room{position:relative;aspect-ratio:16/10;width:100%;border-radius:18px;overflow:hidden;border:2px solid #b8862b;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.room svg{width:100%;height:100%;display:block}.hot{cursor:pointer;transition:filter .2s}.hot:hover,.hot:focus{filter:drop-shadow(0 0 10px #ffe08a) brightness(1.15);outline:none}
.hot.done{filter:grayscale(.2) brightness(.85)}.hot.done:hover{filter:none}
.inv{display:flex;flex-wrap:wrap;gap:8px}.invi{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;background:rgba(232,193,90,.15);border:1px solid rgba(232,193,90,.4);font-weight:800;color:#ffe7a6}
.lock4{display:flex;gap:8px;justify-content:center}.lock4 input{width:56px;height:64px;text-align:center;font:700 30px var(--ft);border-radius:12px;border:2px solid #c9a35a;background:#fffdf6;color:#5b2a92;text-transform:uppercase}
.mirror{display:inline-block;transform:scaleX(-1);font:600 22px var(--fb)}
/* ---------- fucina, verbario ---------- */
.ctab{width:100%;border-collapse:collapse;font:500 17px var(--fb)}.ctab td,.ctab th{padding:7px 10px;border-bottom:1px solid rgba(201,163,90,.45);text-align:left}.ctab th{font:700 13px var(--fs);letter-spacing:.1em;text-transform:uppercase;color:#8a5d17}
.ctab td:first-child{color:#8a5d17;font-style:italic;width:30%}.ctab input{width:100%;min-height:42px;border-radius:9px;border:2px solid #c9a35a;background:#fffdf6;font:600 18px var(--fb);padding:4px 8px;color:var(--ink)}
.ctab input.ok{border-color:#2f9e6e;background:#e8fff2}.ctab input.ko{border-color:#c8402a;background:#fff0ec}
.vgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}.vcard{padding:12px 14px;border-radius:14px;background:#fffaf0;border:1px solid #d9bd7a}.vcard h4{margin:0 0 6px;font:700 15px var(--fs);letter-spacing:.08em;text-transform:uppercase;color:#7a1f1f}
.vcard div{font:500 16px/1.5 var(--fb);color:var(--ink)}.vcard i{color:#8a5d17}
.srch{width:100%;min-height:50px;border-radius:12px;border:2px solid #c9a35a;background:#fffdf6;padding:8px 14px;font:500 19px var(--fb);color:var(--ink)}
.vlist{display:flex;flex-wrap:wrap;gap:6px;max-height:28vh;overflow:auto}.vlist button{min-height:38px;padding:4px 12px;border-radius:999px;border:1px solid #c9a35a;background:#fff8e6;color:var(--ink);font:500 15px var(--fb)}
.vlist button.on{background:#e8c15a}
/* ---------- scriba ---------- */
.ta{width:100%;min-height:34vh;border-radius:14px;border:2px solid #c9a35a;background:repeating-linear-gradient(#fffdf6 0 33px,#e9dcc0 33px 34px);padding:6px 14px;font:500 20px/34px var(--fb);color:var(--ink);resize:vertical}
.ta:focus{outline:none;box-shadow:0 0 0 4px rgba(232,193,90,.35)}
.chk{display:flex;flex-wrap:wrap;gap:6px}.chk span{padding:4px 10px;border-radius:999px;border:1px solid #c9a35a;font:600 14px var(--fs);color:#7a5a2a;background:#fff8e6}.chk span.on{background:#bfeed6;border-color:#2f9e6e;color:#1f5a3a}
.rep{display:grid;gap:10px}.rep .it{padding:10px 12px;border-radius:12px;background:#fffaf0;border:1px solid #d9bd7a;font:500 16px/1.45 var(--fb);color:var(--ink)}.rep .it b{font-family:var(--fs)}.rep .warn{border-color:#e0a050;background:#fff4e0}.rep .good{border-color:#2f9e6e;background:#effbf4}
mark.err{background:#f7c9bd;border-radius:4px;padding:0 2px}
/* ---------- dettato ---------- */
.diff{font:500 22px/1.7 var(--fb);text-align:center}.diff .ok{color:#1f7a52}.diff .ko{color:#a8321f;text-decoration:underline wavy}.diff .mis2{color:#8a5d17;background:#ffeab0;border-radius:4px;padding:0 3px}
/* ---------- parola magica ---------- */
.wgrid{display:grid;gap:6px;justify-content:center}.wrow{display:grid;grid-template-columns:repeat(5,min(15vw,62px));gap:6px}
.wc{height:min(15vw,62px);border-radius:10px;border:2px solid rgba(232,193,90,.35);display:grid;place-items:center;font:800 clamp(24px,5vw,34px) var(--fs);text-transform:uppercase;color:#fff;background:rgba(20,12,50,.6)}
.wc.f{border-color:#e8c15a;animation:pop .15s}.wc.g{background:#2f9e6e;border-color:#7cf0b0}.wc.y{background:#c99a20;border-color:#ffe17a}.wc.x{background:#3a3358;border-color:#4a4370;color:#bdb6d6}.wc.rev{animation:flipc .5s both}
@keyframes flipc{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.kb{display:flex;flex-direction:column;gap:6px;align-items:center;margin-top:12px}.kb .r{display:flex;gap:5px}.kb button{min-width:min(8vw,44px);height:52px;border-radius:9px;border:1px solid rgba(232,193,90,.35);background:rgba(60,44,120,.8);color:#fff;font:700 18px var(--fs);text-transform:uppercase}
.kb button.wide{min-width:min(16vw,76px);font-size:13px}.kb button.g{background:#2f9e6e}.kb button.y{background:#c99a20}.kb button.x{background:#2a2444;color:#8a83a8}
/* ---------- memoria ---------- */
.mgrid{display:grid;gap:10px;grid-template-columns:repeat(var(--cols,4),1fr);max-width:720px;margin:0 auto}
.mc{aspect-ratio:3/4;perspective:800px;border:0;background:none;padding:0}.mc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}.mc.open .in,.mc.done .in{transform:rotateY(180deg)}
.mc .fa,.mc .ba{position:absolute;inset:0;border-radius:14px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mc .fa{background:radial-gradient(circle at 50% 40%,#5a3aa0,#241650);border:2px solid #b8862b;box-shadow:inset 0 0 0 5px rgba(232,193,90,.25)}.mc .fa .ic{width:46%;height:46%;color:var(--gold);opacity:.85}
.mc .ba{transform:rotateY(180deg);background:linear-gradient(180deg,#fffaf0,#f1dfb6);border:2px solid #c9a35a;color:var(--ink);font:600 clamp(14px,1.6vw,19px)/1.2 var(--fb);padding:6px;text-align:center}.mc .ba.e{font-size:clamp(34px,5vw,54px)}
.mc.done .ba{border-color:#2f9e6e;box-shadow:0 0 16px rgba(47,158,110,.6)}
/* ---------- grimorio ---------- */
.flash3d{perspective:1200px;max-width:520px;margin:0 auto}.fcard{position:relative;height:300px;transition:transform .6s;transform-style:preserve-3d;cursor:pointer}.fcard.flip{transform:rotateY(180deg)}
.fcard .s{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px;text-align:center}
.fcard .s.b{transform:rotateY(180deg)}.fcard .w{font:700 clamp(30px,2vw + 18px,46px) var(--ft);color:#7a1f1f}
.boxes{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.boxes div{text-align:center;padding:8px 4px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(232,193,90,.25);font-size:12.5px}.boxes b{display:block;font:700 22px var(--ft);color:var(--gold)}
.wordlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}.wl{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(232,193,90,.2);font-size:15px}.wl .e{font-size:24px}
/* ---------- classe ---------- */
.teams{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.team{padding:14px;border-radius:16px;border:2px solid var(--tc);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(0,0,0,.2));text-align:center}
.team b{display:block;font:700 22px var(--ft);color:var(--tc)}.team .sc{font:700 46px var(--ft);color:#fff}.team .btn{margin-top:6px}
body[data-scr=classe] .qprompt{font-size:clamp(26px,2vw + 16px,48px)}body[data-scr=classe] .opt{font-size:clamp(20px,1vw + 15px,30px);min-height:70px}
.wheel{width:min(320px,70vw);aspect-ratio:1;margin:0 auto;border-radius:50%;position:relative;transition:transform 4s cubic-bezier(.15,.7,.1,1);box-shadow:0 0 0 6px #b8862b,0 0 30px rgba(232,193,90,.4)}
.pointer{width:0;height:0;margin:0 auto -8px;border:16px solid transparent;border-top:26px solid var(--gold);position:relative;z-index:2}
/* ---------- bazar, trofei, statistiche ---------- */
.shop{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.shop .it{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;border-radius:14px;border:1px solid rgba(232,193,90,.3);background:rgba(20,12,50,.6)}
.shop .it .sw{width:52px;height:52px;border-radius:50%;border:3px solid rgba(255,255,255,.4);box-shadow:0 0 14px rgba(0,0,0,.4)}.shop .it.on{border-color:var(--gold);box-shadow:0 0 18px rgba(232,193,90,.4)}
.achs{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.ach{display:flex;gap:10px;align-items:center;padding:12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);opacity:.5}
.ach.on{opacity:1;border-color:rgba(232,193,90,.5);background:rgba(232,193,90,.08)}.ach .em{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff3c4,#e8c15a 45%,#8a5d17);color:#2a1503}
.ach b{display:block;font:700 17px var(--ft);color:#fff1c4}.ach small{font-size:13px}
.kpi{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}.kpi div{padding:14px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid rgba(232,193,90,.2)}.kpi b{display:block;font:700 30px var(--ft);color:var(--gold)}.kpi span{font-size:13.5px;color:var(--mut)}
.skb{display:grid;gap:8px}.skb .r{display:grid;grid-template-columns:minmax(120px,1fr) 2fr 52px;gap:10px;align-items:center;font-size:14.5px}
.days{display:flex;gap:4px;align-items:flex-end;height:110px}.days div{flex:1;background:linear-gradient(0deg,var(--gold2),var(--gold));border-radius:4px 4px 0 0;min-height:2px;position:relative}.days span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mut)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14.5px;color:#e9e0ff}label.f input[type=text],label.f textarea,label.f select{min-height:46px;border-radius:10px;border:1px solid rgba(232,193,90,.4);background:rgba(10,6,30,.6);color:#fff;padding:8px 12px;font:500 16px var(--fs)}
label.f textarea{min-height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
input[type=range]{width:100%;accent-color:var(--gold)}.sw2{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;border-bottom:1px solid rgba(255,255,255,.08)}
/* ---------- titolo ---------- */
.title{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:calc(var(--top) + 1vh) 16px max(18px,env(safe-area-inset-bottom));pointer-events:none;overflow:hidden}
.title>*{pointer-events:auto}.logo{text-align:center}.logo h2{font:700 clamp(40px,4.6vw + 18px,96px)/.95 var(--ft);margin:0;background:linear-gradient(180deg,#fff6cf,#e8c15a 50%,#a86f1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #2a1503) drop-shadow(0 0 22px rgba(232,193,90,.45))}
.logo p{font:italic 500 clamp(17px,.8vw + 13px,24px) var(--fb);color:#e8dcff;margin:6px 0 0;text-shadow:0 2px 8px #000}
.title .logo{transition:opacity .9s,transform .9s}.title.go .logo{opacity:0;transform:translateY(-40px)}.title.go .tstart{opacity:0;transition:opacity .6s}
.tstart{display:flex;flex-direction:column;align-items:center;gap:10px}.tstart .btn.big{font-size:22px;min-width:min(340px,86vw);animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 34px rgba(232,193,90,.7),0 8px 22px rgba(0,0,0,.35)}}
/* ---------- modale e notifiche ---------- */
#modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(5,3,15,.8)}#modal.on{display:flex}
.mbox{position:relative;width:min(600px,100%);max-height:88dvh;overflow:auto;padding:22px;border-radius:20px;background:linear-gradient(180deg,#241a55,#120c30);border:1px solid rgba(232,193,90,.5);box-shadow:0 30px 70px rgba(0,0,0,.6);animation:pop .3s}
.mbox.parch{background:radial-gradient(140% 100% at 15% 0%,#fffaea 0,transparent 55%),linear-gradient(180deg,#f8eed6,#ecd8ab);color:var(--ink)}
.mx{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:12px;border:1px solid rgba(232,193,90,.4);background:rgba(255,255,255,.06);color:var(--gold);display:grid;place-items:center}
.lvup{text-align:center}.lvring{width:110px;height:110px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;font:700 56px var(--ft);color:#3a2105;background:radial-gradient(circle at 35% 30%,#fff6cf,#e8c15a 50%,#8a5d17);box-shadow:0 0 40px rgba(232,193,90,.7)}
#toasts{position:fixed;right:12px;top:calc(var(--top) + 8px);z-index:25;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:min(360px,calc(100vw - 24px))}
.toast{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:rgba(20,12,50,.94);border:1px solid rgba(232,193,90,.45);box-shadow:0 10px 26px rgba(0,0,0,.45);transform:translateX(30px);opacity:0;transition:.35s;font-size:15px}
.toast.in{transform:none;opacity:1}.toast .ic{width:28px;height:28px;color:var(--gold)}.toast.bad{border-color:rgba(200,64,42,.6)}.toast.gold{border-color:var(--gold);box-shadow:0 0 22px rgba(232,193,90,.35)}
.flash{position:fixed;inset:0;z-index:15;pointer-events:none;animation:fo .5s forwards}@keyframes fo{to{opacity:0}}
.res{text-align:center}.res .big{font:700 clamp(42px,3vw + 24px,72px) var(--ft);color:var(--gold)}.res .stars3{font-size:44px;letter-spacing:8px;color:var(--gold)}.res .stars3 .off{color:rgba(255,255,255,.18)}
.miss{display:grid;gap:6px;margin-top:10px;text-align:left}.miss div{padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05);font-size:15px}
.cnt{font:700 15px var(--fs);color:var(--gold);letter-spacing:.05em}
.hide{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.main:focus{outline:none}
/* ---------- impaginazione: telefono (verticale) ---------- */
#gcol{left:8px;right:8px;top:calc(var(--top) + 2px);height:25dvh;flex-direction:row-reverse;align-items:stretch}
#gslot{flex:0 0 38%}#bubble{flex:1;max-height:100%;align-self:center}
#bubble::before{content:'';position:absolute;left:-11px;top:50%;margin-top:-10px;border:10px solid transparent;border-right:11px solid #caa35a}
.main{left:0;right:0;top:calc(var(--top) + 25dvh + 8px);bottom:0;padding:4px 10px max(20px,env(safe-area-inset-bottom))}
body[data-lay=title] #gcol{left:12vw;right:12vw;top:24dvh;height:auto;bottom:24dvh}body[data-lay=title] #gslot{flex:1}body[data-lay=title] #bubble{display:none}
body[data-lay=title] .main{inset:0;padding:0;overflow:hidden;pointer-events:none}
body[data-lay=aki] #gcol{height:31dvh}body[data-lay=aki] .main{top:calc(var(--top) + 31dvh + 8px)}
body[data-lay=battle] #gcol{right:auto;width:42vw;height:28dvh}body[data-lay=battle] #bubble{display:none}body[data-lay=battle] #gslot{flex:1}

.room .bub{animation:bub 2.2s ease-in infinite}.room .b2{animation-delay:-.7s}.room .b3{animation-delay:-1.4s}@keyframes bub{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-70px);opacity:0}}

.room .swirl{transform-box:fill-box;transform-origin:50% 50%;animation:swr 7s linear infinite}@keyframes swr{to{transform:rotate(360deg)}}
.room .glow{animation:rgl 1.6s ease-in-out infinite alternate}@keyframes rgl{to{opacity:.6}}

<script>
(function(){"use strict";
/* ===== Shader del Genio Gennaro e dei nemici (raymarching di superfici implicite) =====
   ET = tipo di nemico compilato nel programma: 0 nessuno, 1 slime, 2 fantasma, 3 folletto, 4 golem, 5 drago, 6 arcimago, 7 rospo,
   8 pipistrello, 9 fungo, 10 ragno, 11 teschio, 12 scrigno mimic, 13 spirito del fuoco, 14 piovra. uEB.w = variante (golem di ghiaccio, strega, drago d'ombra) */
const GVS = `attribute vec2 aP;void main(){gl_Position=vec4(aP,0.0,1.0);}`;
function genFS(et){ return `precision highp float;
#define ET ${et}
uniform vec2 uRes; uniform float uTime; uniform vec3 uRo; uniform float uFocal; uniform float uSteps; uniform float uQ;
uniform vec4 uG; uniform float uYaw; uniform vec4 uBody; uniform mat3 uHR; uniform vec4 uFace; uniform vec4 uFace2;
uniform vec3 uAL[4]; uniform vec3 uAR[4]; uniform vec2 uPoint; uniform vec4 uT[6]; uniform vec4 uTB; uniform vec4 uBall;
uniform vec4 uLamp; uniform vec3 uSkin; uniform vec3 uTurb; uniform vec3 uVest; uniform vec3 uLampC; uniform vec4 uGlow;
uniform vec3 uHandLW; uniform vec3 uHandRW; uniform vec3 uGemW; uniform vec3 uSpoutW; uniform vec3 uMagic;
uniform vec4 uE; uniform vec4 uEA; uniform vec4 uEB; uniform vec3 uEC1; uniform vec3 uEC2; uniform vec3 uEG1; uniform vec3 uEG2; uniform vec3 uEG3;
uniform vec3 uKey; uniform vec3 uRim; uniform vec3 uSky; uniform vec3 uGnd;
float gMat; bool gWant;
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,s,-s,c);}
float smin(float a,float b,float k){float h=max(k-abs(a-b),0.0)/k;return min(a,b)-h*h*k*0.25;}
float smax(float a,float b,float k){return -smin(-a,-b,k);}
float sdEll(vec3 p,vec3 r){float k0=length(p/r);float k1=length(p/(r*r));return k0*(k0-1.0)/max(k1,1e-5);}
float sdCap(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/max(dot(ba,ba),1e-6),0.0,1.0);return length(pa-ba*h)-r;}
float sdRC(vec3 p,vec3 a,vec3 b,float r1,float r2){
  vec3 ba=b-a;float l2=dot(ba,ba);if(l2<1e-6)return length(p-a)-max(r1,r2);
  float rr=r1-r2;float a2=l2-rr*rr;float il2=1.0/l2;vec3 pa=p-a;float y=dot(pa,ba);float z=y-l2;
  vec3 xv=pa*l2-ba*y;float x2=dot(xv,xv);float y2=y*y*l2;float z2=z*z*l2;float k=sign(rr)*rr*rr*x2;
  if(sign(z)*a2*z2>k)return sqrt(x2+z2)*il2-r2;
  if(sign(y)*a2*y2<k)return sqrt(x2+y2)*il2-r1;
  return (sqrt(x2*a2*il2)+y*rr)*il2-r1;}
float sdTor(vec3 p,vec2 t){vec2 q=vec2(length(p.xz)-t.x,p.y);return length(q)-t.y;}
float sdRing(vec3 p,vec3 c,vec3 n,float R,float r){vec3 q=p-c;float h=dot(q,n);vec3 qp=q-n*h;return length(vec2(length(qp)-R,h))-r;}
float sdRBox(vec3 p,vec3 b,float r){vec3 q=abs(p)-b;return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0)-r;}
float hash(vec3 p){p=fract(p*0.3183099+0.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float noise(vec3 x){vec3 i=floor(x);vec3 f=fract(x);f=f*f*(3.0-2.0*f);
 return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z);}
void U(inout float d,float x,float m){if(x<d){d=x;if(gWant)gMat=m;}}

/* ---------- GENIO ---------- */
float mouthSD(vec3 h){vec3 m=h-vec3(0.0,0.842,0.30);m.y-=uFace.z*2.6*m.x*m.x;return sdEll(m,vec3(0.105+0.025*abs(uFace.z),0.014+0.065*uFace.y,0.1));}
float headSkin(vec3 h){
  float d=sdEll(h-vec3(0.0,1.02,0.0),vec3(0.35,0.39,0.35));
  d=smin(d,sdEll(h-vec3(0.0,0.865,0.07),vec3(0.25,0.19,0.25)),0.12);
  vec3 hm=vec3(abs(h.x),h.y,h.z);
  vec3 e=hm-vec3(0.35,1.03,-0.03);e.xy=rot(-0.55)*e.xy;
  d=smin(d,sdEll(e-vec3(0.0,0.07,0.0),vec3(0.04,0.155,0.075)),0.035);
  d=smin(d,sdEll(h-vec3(0.0,0.952,0.352),vec3(0.06,0.087,0.072)),0.05);
  vec3 ec=hm-vec3(0.13,1.055,0.28);
  d=smax(d,-(length(ec)-0.098),0.02);
  float lt=mix(0.078,-0.112,uFace.x);float lb=mix(-0.12,-0.035,uFace2.w);
  float lid=max(length(ec)-0.103,lt-ec.y);lid=min(lid,max(length(ec)-0.102,ec.y-lb));
  d=smin(d,lid,0.012);
  d=smax(d,-mouthSD(h),0.012);

function sprites(){
  sGlow=mkc(128,128);let g=sGlow.getContext('2d'),gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,207,122,.55)');gr.addColorStop(1,'rgba(255,207,122,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);
  sFlame=mkc(64,120);g=sFlame.getContext('2d');const sc=3.6;g.setTransform(sc,0,0,sc,32,112);
  g.beginPath();g.moveTo(0,-30);g.bezierCurveTo(6,-18,8,-10,0,0);g.bezierCurveTo(-8,-10,-6,-18,0,-30);g.closePath();
  g.setTransform(sc*9.6,0,0,sc*18,32,112-9*sc);gr=g.createRadialGradient(0,0,0,0,0,1);gr.addColorStop(0,'#fffbe0');gr.addColorStop(0.45,'#ffd36a');gr.addColorStop(1,'rgba(255,122,42,0)');g.fillStyle=gr;g.fill();
  sDot=mkc(32,32);g=sDot.getContext('2d');gr=g.createRadialGradient(16,16,0,16,16,16);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.3,'rgba(255,255,255,.8)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,32,32);
  waxG=CAND.map(c=>{const gw=cx.createLinearGradient(-c[2]/2,0,c[2]/2,0);gw.addColorStop(0,'#cdbf9f');gw.addColorStop(0.45,'#fff6df');gw.addColorStop(1,'#b9a983');return gw;});}
function stars(){TW.length=0;const add=(n,cx0,cy0,rx,ry,yMax,avoid)=>{let tries=0;while(n>0&&tries++<400){const x=cx0-rx+Math.random()*rx*2,y=cy0-ry+Math.random()*(yMax-cy0+ry);
    const u=(x-cx0)/rx;if(Math.abs(u)>0.94)continue;const top=cy0-ry*Math.sqrt(1-u*u)+10;if(y<top||y>yMax)continue;if(avoid&&avoid(x,y))continue;
    TW.push({x,y,r:0.7+Math.random()*1.3,ph:Math.random()*6.28,sp:1.2+Math.random()*2.2});n--;}};
  add(20,800,250,200,172,360,(x,y)=>Math.hypot(x-905,y-195)<62||Math.abs(x-800)<7||Math.abs(y-330)<7||Math.abs(Math.hypot(x-800,y-200)-46)<6);
  add(8,310,300,95,118,420,(x,y)=>Math.abs(x-310)<6||Math.abs(y-380)<6);add(8,1290,300,95,118,420,(x,y)=>Math.abs(x-1290)<6||Math.abs(y-380)<6);}
function mote(any){return {x:Math.random()*innerWidth,y:any?Math.random()*innerHeight:innerHeight+10,vx:(Math.random()-0.5)*6,vy:-4-Math.random()*10,s:1+Math.random()*2.2,a:0.15+Math.random()*0.4,ph:Math.random()*6.28,c:Math.random()<0.7?'rgba(255,214,120,1)':'rgba(111,227,255,1)'};}
function init(canvas){cv=canvas;if(!cv)return;cx=cv.getContext('2d');reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;sprites();stars();for(let i=0;i<26;i++)MO.push(mote(true));size();addEventListener('resize',size);}
function size(){if(!cv)return;const r=cv.getBoundingClientRect();aw=Math.max(1,r.width);ah=Math.max(1,r.height);k=Math.min(devicePixelRatio||1,1.5);
  cv.width=Math.round(aw*k);cv.height=Math.round(ah*k);s=Math.max(aw/1600,ah/900);ox=(aw-1600*s)/2;oy=(ah-900*s)/2;dirty=true;}
function draw(){const st=calm||reduced;const atmo=document.body.dataset.atmo||'';lastAtmo=atmo;dirty=false;
  cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);const T=st?1.3:t;
  // stelle che brillano dentro le finestre
  const dim=atmo==='tramonto'?0.35:1;cx.globalCompositeOperation='lighter';
  for(const p of TW){const a=dim*(st?0.6:0.2+0.8*(0.5+0.5*Math.sin(T*p.sp+p.ph)));if(a<0.03)continue;cx.globalAlpha=a;const d=p.r*5*s*k;
    cx.drawImage(sDot,(ox+p.x*s)*k-d/2,(oy+p.y*s)*k-d/2,d,d);}
  // pulviscolo dorato (coordinate dello schermo; la tela sporge di 24 px su ogni lato)
  if(motes&&!st){for(const m of MO){const a=m.a*(0.6+0.4*Math.sin(m.ph*2));cx.globalAlpha=a;const d=m.s*4*k;cx.drawImage(FX.sprite(m.c),(m.x+24)*k-d/2,(m.y+24)*k-d/2,d,d);}}
  cx.globalCompositeOperation='source-over';
  // candele sospese
  CAND.forEach((c,i)=>{const bob=st?0:-12*(0.5-0.5*Math.cos((T+c[5])/7*6.2832));const x=ox+c[0]*s,y=oy+(c[1]+bob)*s;
    cx.setTransform(k*s,0,0,k*s,x*k,y*k);cx.globalAlpha=1;
    cx.drawImage(sGlow,-c[4],-20-c[4],c[4]*2,c[4]*2);
    cx.fillStyle=waxG[i];cx.beginPath();if(cx.roundRect)cx.roundRect(-c[2]/2,0,c[2],c[3],4);else cx.rect(-c[2]/2,0,c[2],c[3]);cx.fill();
    const f=st?0.4:0.5+0.5*Math.sin(T*19.6+i*1.7)*Math.sin(T*7.3+i);const fh=c[3]>65?30:c[3]>60?28:c[3]>55?26:24;const sx=(1-0.12*f)*fh/30,sy=(1+0.1*f)*fh/30;
    cx.drawImage(sFlame,-32/3.6*sx,(-112/3.6)*sy,64/3.6*sx,120/3.6*sy);});
  cx.setTransform(1,0,0,1,0,0);cx.globalAlpha=1;}
function update(dt){if(!cv||document.hidden)return;t+=dt;
  if(motes&&!calm&&!reduced)for(const m of MO){m.ph+=dt;m.x+=(m.vx+Math.sin(m.ph*0.7)*6)*dt;m.y+=m.vy*dt;if(m.y<-30||m.x<-30||m.x>innerWidth+30)Object.assign(m,mote(false));}
  if(calm||reduced){if(dirty||lastAtmo!==(document.body.dataset.atmo||''))draw();return;}
  odd=!odd;if(odd||dirty)draw();}
return {init,update,size,set calm(v){if(v!==calm){calm=v;dirty=true;}},set motes(v){motes=v;dirty=true;}};
})();

const Conj=(()=>{

  function join(st,end){ // ortografia: -care/-gare, -iare
    if(/[cg]$/.test(st)&&/^[ie]/.test(end))return st+'h'+end;
    if(/i$/.test(st)&&/^i/.test(end))return st+end.slice(1);

  function presente(v){const {irr,cl,st}=info(v);if(irr.pr)return irr.pr.split(',');
    if(cl==='are')return ['o','i','a','iamo','ate','ano'].map(e=>join(st,e));

    if(v.isc)return ['isco','isci','isce','iamo','ite','iscono'].map(e=>st+e);
    return ['o','i','e','iamo','ite','ono'].map(e=>st+e);}
  function part(v){const {irr,cl,st}=info(v);if(irr.pp)return irr.pp.split('|');return [st+(cl==='are'?'ato':cl==='ere'?'uto':'ito')];}

    if(cl==='are'){if(/[cg]i$/.test(st))return [st.slice(0,-1)+'er'];return [join(st,'er')];}
    return [st+(cl==='ere'?'er':'ir')];}
  function futuro(v){const S=futStem(v);return ['ò','ai','à','emo','ete','anno'].map(e=>S.map(s=>s+e).join('|'));}
  function condiz(v){const S=futStem(v);return ['ei','esti','ebbe','emmo','este','ebbero'].map(e=>S.map(s=>s+e).join('|'));}
  function congiuntivo(v){const {irr,cl,st}=info(v);if(irr.cg)return irr.cg.split(',');

  function gerundio(v){const {irr,cl,st,inf}=info(v);if(inf==='essere')return 'essendo';if(irr.st)return irr.st+'endo';return st+(cl==='are'?'ando':'endo');}
  const AUXA=['ho','hai','ha','abbiamo','avete','hanno'],AUXE=['sono','sei','è','siamo','siete','sono'],STA=['sto','stai','sta','stiamo','state','stanno'];

const Art=(()=>{
  const V=/^[aeiouàèéìòùh]/i;
  function sImp(w){w=w.toLowerCase();return /^(s[^aeiouàèéìòù]|z|gn|ps|pn|x|y|i[aeiou])/.test(w);}
  function det(w,g,pl){if(g==='c')g='m';
    if(g==='f')return pl?'le':(V.test(w)?"l'":'la');
    if(pl)return (V.test(w)||sImp(w))?'gli':'i';
    return V.test(w)?"l'":(sImp(w)?'lo':'il');}
  function ind(w,g){if(g==='c')g='m';if(g==='f')return V.test(w)?"un'":'una';return sImp(w)?'uno':'un';}
  function withArt(a,w){return a.endsWith("'")?a+w:a+' '+w;}
  const PA={di:{il:'del',lo:'dello',"l'":"dell'",la:'della',i:'dei',gli:'degli',le:'delle'},a:{il:'al',lo:'allo',"l'":"all'",la:'alla',i:'ai',gli:'agli',le:'alle'},
    da:{il:'dal',lo:'dallo',"l'":"dall'",la:'dalla',i:'dai',gli:'dagli',le:'dalle'},in:{il:'nel',lo:'nello',"l'":"nell'",la:'nella',i:'nei',gli:'negli',le:'nelle'},
    su:{il:'sul',lo:'sullo',"l'":"sull'",la:'sulla',i:'sui',gli:'sugli',le:'sulle'}};
  return {det,ind,withArt,PA,sImp,
    full(w,pl){const word=pl?w.pl:w.it,g=pl?w.plg:w.g;return withArt(det(word,g,pl),word);},
    indFull(w){return withArt(ind(w.it,w.g),w.it);}};
})();

const Num=(()=>{
  const U=['zero','uno','due','tre','quattro','cinque','sei','sette','otto','nove'],T=['dieci','undici','dodici','tredici','quattordici','quindici','sedici','diciassette','diciotto','diciannove'],
  D=['','','venti','trenta','quaranta','cinquanta','sessanta','settanta','ottanta','novanta'];
  function lt100(n,fin){if(n<10)return U[n];if(n<20)return T[n-10];const t=D[Math.floor(n/10)],u=n%10;if(!u)return t;
    return (u===1||u===8?t.slice(0,-1):t)+(u===3?'tré':U[u]);}
  let words=function(n){if(n<100)return lt100(n);if(n<1000){const h=Math.floor(n/100),r=n%100;let hw=h===1?'cento':U[h]+'cento';if(!r)return hw;
      let rw=lt100(r);if(/^ott/.test(rw))hw=hw.slice(0,-1);return hw+rw;}
    if(n<2000)return 'mille'+(n%1000?words(n%1000):'');const k=Math.floor(n/1000),r=n%1000;return (k<100?lt100(k):words(k))+'mila'+(r?words(r):'');}
  const _w=words;words=function(n){let w=_w(n);if(n>20&&n%10===3&&n%100!==13&&/tre$/.test(w))w=w.slice(0,-3)+'tré';return w;};
  function variants(n){const w=words(n),s=new Set([w]);if(n%100===1&&n>100)s.add(w.replace(/centouno$/,'centuno'));if(n===3)s.add('tre');return [...s];}
  const HN=['mezzanotte','una','due','tre','quattro','cinque','sei','sette','otto','nove','dieci','undici','dodici'];
  function ore(h,m){ // h 0-23, m multiplo di 5
    const h12=h%12===0?12:h%12;const nm=(h+1)%12===0?12:(h+1)%12;const out=[];
    const base=(hh,midday)=>{if(midday==='mezzogiorno')return 'È mezzogiorno';if(midday==='mezzanotte')return 'È mezzanotte';return hh===1?"È l'una":'Sono le '+HN[hh];};
    const special=(hh,hr)=>hr===12?'mezzogiorno':hr===0?'mezzanotte':null;
    const cur=base(h12,special(h12,h)),next=base(nm,special(nm,(h+1)%24));
    if(m===0){out.push(cur);if(h===12||h===0)out.push('Sono le dodici');return out;}
    const mw=m===15?['un quarto','quindici']:m===30?['mezza','mezzo','trenta']:[words(m)];
    mw.forEach(x=>out.push(cur+' e '+x));
    if(m>=40){const rem=60-m;const rw=rem===15?['un quarto','quindici']:[words(rem)];rw.forEach(x=>out.push(next+' meno '+x));}
    return out;}
  return {words,variants,ore};
})();

const Txt=(()=>{
  const deacc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
  function norm(s){return String(s||'').toLowerCase().replace(/[’`´]/g,"'").replace(/([aeiou])'(?=\s|$)/g,(m,v)=>({a:'à',e:'è',i:'ì',o:'ò',u:'ù'})[v]).replace(/\s+/g,' ').replace(/\s*'\s*/g,"'").replace(/[.!?¡¿,;:"«»()]/g,'').trim();}
  // accetta anche l'accento scritto con apostrofo (e' -> è)
  function fixApos(s){return s.replace(/([aeiou])'(?=\s|$)/g,(m,v)=>({a:'à',e:'è',i:'ì',o:'ò',u:'ù'})[v]);}
  function check(inp,answers){const n=norm(inp);if(!n)return {ok:false,empty:true};const list=[].concat(answers).map(norm);
    if(list.includes(n))return {ok:true,exact:true};const f=fixApos(n);if(list.includes(f))return {ok:true,exact:true};
    const d=deacc(f);for(const a of list)if(deacc(a)===d)return {ok:true,exact:false,accent:a};
    let best=99,ba='';for(const a of list){const x=lev(deacc(a),d);if(x<best){best=x;ba=a;}}
    return {ok:false,close:best<=Math.max(1,Math.floor(ba.length/6)),best:ba,dist:best};}
  function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let prev=Array.from({length:n+1},(_,i)=>i),cur=new Array(n+1);
    for(let i=1;i<=m;i++){cur[0]=i;for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));[prev,cur]=[cur,prev];}return prev[n];}
  const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
  return {norm,deacc,check,lev,cap,fixApos};
})();

const Genie=(()=>{let tw=0,queue=Promise.resolve(),curEn='',curTxt='';
  function el(){return $('#bubble');}

  function say(text,o){o=o||{};const b=el();if(!b)return Promise.resolve();clearInterval(tw);curTxt=text;curEn=o.en||'';
    const t=$('.btxt',b);const plain=String(text);b.classList.add('on');const sr=$('#srlive');if(sr){sr.textContent='';setTimeout(()=>{sr.textContent=Snd.Voice.clean(plain);},40);}b.classList.toggle('hasen',!!curEn);$('.ben',b).classList.remove('open');$('.ben',b).textContent=curEn;
    if(o.act!==null&&o.act!==undefined)Stage.act(o.act||'talk');const html=o.html||esc(plain);
    let spoken=0;if(S.set.voice&&o.tts!==false)spoken=Snd.Voice.speak(o.speak||plain);if(!spoken)Stage.talk(Math.min(4,plain.length/28));
    if(S.set.motion===false||FX.reduced||o.instant){t.innerHTML=html;return Promise.resolve();}
    // macchina da scrivere che rispetta i tag
    t.innerHTML=html;const nodes=[];const walk=n=>{for(const c of [...n.childNodes]){if(c.nodeType===3){nodes.push([c,c.textContent]);c.textContent='';}else walk(c);}};walk(t);
    const total=nodes.reduce((a,n)=>a+n[1].length,0),dur=spoken?Math.min(spoken*900,total*45):total*22,per=Math.max(8,dur/Math.max(1,total));let i=0,k=0;
    return new Promise(res=>{tw=setInterval(()=>{for(let s=0;s<Math.ceil(16/per);s++){if(k>=nodes.length){clearInterval(tw);res();return;}const [n,txt]=nodes[k];n.textContent=txt.slice(0,++i);if(i>=txt.length){k++;i=0;}}
      if(Math.random()<0.25)Snd.fx('type');},16);});}
  function init(){const b=el();$('.blisten',b).onclick=()=>{Snd.init();Snd.Voice.speak(curTxt,{force:true});};

  return {say,show,init,get text(){return curTxt}};})();

    W5_EXTRA.trim().split(/\s+/).forEach(w=>{if(ok(w)){v.add(w);}});['amore','festa','gioia','sogno','mondo','tempo','notte','fiore','libro','gatto','cuore','pizza','cielo','fiume','bosco','sedia','porta','treno','latte','carne','mamma','nonna','nonno','madre','padre','donna','amico','amica','scala','spada','drago','genio','magia','fiaba','isola','torre','luogo','piede','gamba','testa','bocca','dente','festa','danza','canto','verde','rosso','bello','dolce','forte','largo','lungo','nuovo','pieno','vuoto','caldo','calmo','basso','ricco'].forEach(w=>a.add(w));

const TSETS={};function tset(t){if(TSETS[t])return TSETS[t];const s=new Set();const pr=new Set();
  VERBS.forEach(v=>{for(let p=0;p<6;p++){if(t==='pp'){(Conj.form(v,'pp',p)||[]).forEach(f=>s.add(f.split(' ').slice(-2).join(' ')));}else{const f=Conj.form(v,t,p);if(f)f.forEach(x=>s.add(x.split(' ').pop()));const q=Conj.form(v,'pr',p);if(q)q.forEach(x=>pr.add(x.split(' ').pop()));}}});

function analyze(text,pr){const raw=text.trim();const words=(raw.match(/[\p{L}’']+/gu)||[]);const n=words.length;const low=raw.toLowerCase();const toks=words.map(w=>w.toLowerCase().replace(/^[’']+|[’']+$/g,''));const tokset=new Set(toks.concat(toks.map(Txt.deacc)));

  const minW=pr.min||0;const lenOk=n>=minW;score+=minW?Math.min(30,30*n/minW):30;R.push([lenOk?'good':'warn',`<b>Lunghezza:</b> ${n} parole${minW?` (minimo ${minW})`:''}. ${lenOk?'Ottimo!':'Prova ad aggiungere qualche frase.'}`]);

    score+=c>=2?15:c?8:0;R.push([c>=2?'good':'warn',`<b>${esc(TENSES[pr.tense])}:</b> ${c?`l'hai usato ${c} ${c===1?'volta':'volte'}.`:'non l\'ho trovato. Questo tema chiede questo tempo verbale!'}`]);}else score+=15;

function srsInfo(w){const x=LEXM[w];if(x){const ex=SENTS.find(s=>new RegExp('(^|[^a-zà-ù])'+x.it+'([^a-zà-ù]|$)','i').test(s.it));return {em:x.em,en:x.en,it:Art.full(x,false),extra:x.pl?'Plurale: '+Art.full(x,true):'',ex:ex?ex.it:'',ans:[x.it,Art.full(x,false),Art.indFull(x)]};}
  const v=VERBM[w];if(v)return {em:'',en:v.en,it:v.inf,extra:`io ${Conj.form(v,'pr',0)[0].replace(/^mi /,'mi ')} · ${Conj.form(v,'pp',0)[0]}`,ex:'',ans:[v.inf]};
  for(const l of S.lists){const it=l.items.find(i=>i.it===w);if(it)return {em:'',en:it.en,it:it.it,extra:'Lista: '+l.name,ex:'',ans:[it.it]};}return {em:'',en:'',it:w,extra:'',ex:'',ans:[w]};}

/* ---------- Dettato Incantato ---------- */
function dictDiff(exp,got){const tok=s=>s.split(/\s+/).filter(Boolean),E=tok(exp),G=tok(got);const n=w=>Txt.norm(w),d=w=>Txt.deacc(Txt.norm(w));
  const m=E.length,k=G.length,L=[...Array(m+1)].map(()=>new Array(k+1).fill(0));for(let i=m-1;i>=0;i--)for(let j=k-1;j>=0;j--)L[i][j]=d(E[i])===d(G[j])?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const out=[];let i=0,j=0,ok=0;while(i<m||j<k){if(i<m&&j<k&&d(E[i])===d(G[j])){const exact=n(E[i])===n(G[j]);if(exact)ok++;else ok+=0.5;out.push(exact?`<span class="ok">${esc(G[j])}</span>`:`<span class="ko" title="${esc(E[i])}">${esc(G[j])}</span><sup>${esc(E[i])}</sup>`);i++;j++;}
    else if(j<k&&(i>=m||L[i][j+1]>=L[i+1][j])){out.push(`<span class="ko"><s>${esc(G[j])}</s></span>`);j++;}else{out.push(`<span class="mis2">${esc(E[i])}</span>`);i++;}}
  return {html:out.join(' '),score:m?ok/m:0};}

function noteMiss(q,ok,o){if(!q||(o&&o.noMiss))return;if(!Array.isArray(S.miss))S.miss=[];const key=(q.prompt||'')+'|'+(q.full||'')+'|'+(q.sub||'');const i=S.miss.findIndex(x=>x.key===key);
  if(ok){if(i>=0){S.miss.splice(i,1);save();}return;}
  let c;try{c=JSON.parse(JSON.stringify(q));}catch(e){return;}c.key=key;c.t=Date.now();if(i>=0)S.miss.splice(i,1);S.miss.push(c);while(S.miss.length>40)S.miss.shift();save();}

/* ---------- app installabile e senza connessione ---------- */
const PWA=(()=>{let deferred=null,reg=null,updShown=false;
  const web=/^https?:$/.test(location.protocol),local=/^(localhost|127\.|\[::1\])/.test(location.hostname);
  const ua=navigator.userAgent||'',ios=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),android=/android/i.test(ua);
  function standalone(){try{return matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: minimal-ui)').matches||navigator.standalone===true;}catch(e){return false;}}
  function state(){if(standalone())return 'installed';if(!web)return 'file';if(deferred)return 'prompt';return ios?'ios':'manual';}
  function ready(){return !!(navigator.serviceWorker&&navigator.serviceWorker.controller);}
  function statusText(){const st=state(),off=ready()?' Funziona anche senza internet.':'';
    return st==='installed'?'La Lampada è installata su questo dispositivo.'+off:st==='prompt'?'Puoi installare la Lampada come un\'app: si aprirà a schermo intero, con la sua icona.'+off:
      st==='ios'?'Su iPhone e iPad puoi aggiungere la Lampada alla schermata Home da Safari.'+off:st==='manual'?'Puoi installare la Lampada dal menu del browser.'+off:
      'In questo momento la Lampada è aperta come file: per installarla e usarla senza internet, aprila dal sito in cui è pubblicata.';}
  function refresh(){const st=state();$$('[data-install]').forEach(b=>{b.hidden=!(st==='prompt'||st==='ios'||(b.dataset.install==='always'&&st!=='installed'));});const t=$('#appst');if(t)t.textContent=statusText();}
  function init(){
    addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;refresh();});
    addEventListener('appinstalled',()=>{deferred=null;persist();refresh();toast(`${icon('lamp')}<div><b>App installata!</b><br><small>Ora trovi la Lampada tra le tue app.</small></div>`,'gold',4200);});
    addEventListener('offline',()=>toast(`${icon('wifi-off')}<div><b>Sei offline</b><br><small>La Lampada funziona lo stesso: solo la pronuncia e alcune voci hanno bisogno di internet.</small></div>`,'',5000));
    addEventListener('online',()=>toast(`${icon('check')}<div>Di nuovo online!</div>`));
    if(web&&'serviceWorker' in navigator&&(location.protocol==='https:'||local)){let had=!!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='lampada-update')offerUpdate();});
      navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)offerUpdate();had=true;refresh();});
      const doReg=()=>navigator.serviceWorker.register('sw.js').then(r=>{reg=r;}).catch(e=>console.warn('Service worker non registrato:',e));
      if(document.readyState==='complete')doReg();else addEventListener('load',doReg);}
    if(standalone())persist();}
  function offerUpdate(){if(updShown)return;updShown=true;const d=$('#upd');if(!d)return;
    d.innerHTML=`${icon('sun')}<span>È pronta una nuova versione della Lampada!</span><button class="btn sm gold" data-u>Aggiorna</button><button class="x2" data-x aria-label="Più tardi">${icon('x')}</button>`;d.hidden=false;
    $('[data-u]',d).onclick=()=>{saveNow();location.reload();};$('[data-x]',d).onclick=()=>{d.hidden=true;};}
  async function persisted(){try{return !!(navigator.storage&&navigator.storage.persisted&&await navigator.storage.persisted());}catch(e){return false;}}
  async function persist(){try{if(!navigator.storage||!navigator.storage.persist)return false;if(await navigator.storage.persisted())return true;return await navigator.storage.persist();}catch(e){return false;}}
  function guide(){const st=state(),steps=a=>`<ol style="line-height:1.75;padding-left:22px;margin:0 0 12px">${a.map(x=>`<li>${x}</li>`).join('')}</ol>`;
    const h=st==='file'?`<p>In questo momento la Lampada è aperta come <b>file</b>. Per installarla come un'app vera, pubblicala su un sito (per esempio <b>GitHub Pages</b>, gratuito) e aprila da lì: comparirà il pulsante <b>Installa</b>.</p>`:
      ios?steps(['Apri questa pagina con <b>Safari</b>.','Tocca il pulsante <b>Condividi</b> (il quadrato con la freccia verso l\'alto).','Scegli <b>Aggiungi alla schermata Home</b> e poi <b>Aggiungi</b>.']):
      android?steps(['Apri il menu del browser (i tre puntini <b>⋮</b>).','Scegli <b>Installa app</b> oppure <b>Aggiungi a schermata Home</b>.']):
      steps(['Apri la Lampada con <b>Chrome</b> o <b>Edge</b>.','Clicca l\'icona di installazione nella barra dell\'indirizzo, oppure apri il menu <b>⋮</b> e scegli <b>Installa La Lampada delle Parole</b>.']);
    const b=Modal.open(`<h3>Installa la Lampada</h3>${h}<p class="mut"><small>Una volta installata, la Lampada si apre a schermo intero e funziona anche senza internet.</small></p><div class="row end"><button class="btn gold" data-ok>Ho capito</button></div>`);$('[data-ok]',b).onclick=()=>Modal.close();}
  async function install(){if(deferred){const d=deferred;deferred=null;try{await d.prompt();const r=await d.userChoice;if(r&&r.outcome==='accepted')persist();}catch(e){}refresh();return;}guide();}
  function check(){return reg?reg.update().then(()=>true).catch(()=>false):Promise.resolve(false);}
  return {init,install,state,refresh,persist,persisted,check,offerUpdate,get web(){return web}};
})();

const b64e=str=>{const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');};
const b64d=str=>{str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';const s=atob(str);const b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return new TextDecoder().decode(b);};
function listCode(l){return b64e(JSON.stringify({n:l.name,i:l.items.map(x=>x.en?[x.it,x.en]:[x.it])}));}
function listFromCode(txt){txt=String(txt||'').trim();const m=/[#&?]lista=([A-Za-z0-9_-]+)/.exec(txt);const code=m?m[1]:txt;if(!/^[A-Za-z0-9_-]{8,}$/.test(code))return null;
  try{const o=JSON.parse(b64d(code));if(!o||!Array.isArray(o.i))return null;const items=o.i.filter(x=>Array.isArray(x)&&x[0]).map(x=>({it:String(x[0]).slice(0,60),en:x[1]?String(x[1]).slice(0,60):''})).slice(0,400);
    return items.length>=4?{name:String(o.n||'Lista condivisa').slice(0,60),items}:null;}catch(e){return null;}}
function listFromText(t){return String(t).split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&!/^#/.test(l)).map(l=>{const sep=['=',';','\t',','].find(c=>l.includes(c));const [it,en]=sep?[l.slice(0,l.indexOf(sep)),l.slice(l.indexOf(sep)+1)]:[l,''];
  return {it:it.trim().replace(/^"|"$/g,'').slice(0,60),en:(en||'').trim().replace(/^"|"$/g,'').slice(0,60)};}).filter(x=>x.it);}

      if(o.onInterim)o.onInterim(interim||F.filter(Boolean).map(a=>a[0]).join(' '));};
    r.onerror=e=>{if(o.onError)o.onError(e.error||'error');};r.onaudiostart=()=>{if(o.onStart)o.onStart();};
    r.onend=()=>{if(cur===r)cur=null;const fin=F.filter(Boolean);if(o.onEnd)o.onEnd(fin.length===1?fin[0]:fin.length?[fin.map(a=>a[0]).join(' ')]:[]);};
    try{r.start();cur=r;}catch(e){if(o.onError)o.onError('busy');return null;}return r;}
  function stop(){if(cur){try{cur.stop();}catch(e){}}}
  function abort(){if(cur){const c=cur;cur=null;try{c.abort();}catch(e){}}}

  function stop(){return new Promise(res=>{if(!mr||mr.state==='inactive'){res(null);return;}mr.onstop=()=>{const b=new Blob(chunks,{type:mr.mimeType||'audio/webm'});if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(b);off();res(url);};try{mr.stop();}catch(e){res(null);}});}

function ecoNorm(s){s=String(s||'').toLowerCase().replace(/[’`´]/g,"'").replace(/\d+/g,d=>{const n=+d;return n<10000?Num.words(n):d;});return Txt.deacc(s).replace(/(\w)'(?=\w)/g,'$1').replace(/'/g,' ').replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();}
function ecoScore(target,heard,strict){const T=ecoNorm(target).split(' ').filter(Boolean),H=ecoNorm(heard).split(' ').filter(Boolean),m=T.length,n=H.length;if(!m)return {score:0,marks:[]};
  const sim=(a,b)=>{if(a===b)return 1;if(strict)return 0;const d=Txt.lev(a,b);return Math.max(0,1-d/Math.max(a.length,b.length));};
  const D=[...Array(m+1)].map(()=>new Float64Array(n+1));for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--){const s=sim(T[i],H[j]);D[i][j]=Math.max(D[i+1][j],D[i][j+1],(s>=0.5?s:0)+D[i+1][j+1]);}
  const marks=new Array(m).fill(0);let i=0,j=0;while(i<m&&j<n){const s=sim(T[i],H[j]);if(s>=0.5&&Math.abs(D[i][j]-(s+D[i+1][j+1]))<1e-9){marks[i]=s;i++;j++;}else if(D[i+1][j]>=D[i][j+1])i++;else j++;}
  let score=marks.reduce((a,x)=>a+x,0)/m;score*=Math.max(0.75,1-Math.max(0,n-m-1)*0.05);return {score,marks};}
function ecoWords(target,marks){const words=target.split(/\s+/).filter(Boolean),map=[];words.forEach((w,wi)=>ecoNorm(w).split(' ').filter(Boolean).forEach(()=>map.push(wi)));
  return words.map((w,wi)=>{const ms=marks.filter((_,k)=>map[k]===wi);const v=ms.length?Math.min(...ms):1;return `<span class="${v>=0.85?'ok':'ko'}">${esc(w)}</span>`;}).join(' ');}
function ecoItems(cfg){const L=Math.max(1,S.set.lv);
  if(cfg.items)return cfg.items.map(it=>{const w=LEXM[it];return w?{t:w.it,em:w.em,sub:Art.full(w,false),en:w.en,word:w.it}:{t:it,word:null};});
  if(cfg.mode==='frasi')return sample(SENTS.filter(s=>s.lv<=L),6).map(s=>({t:s.it,en:s.en,sent:true}));
  if(cfg.mode==='lingua')return sample(TWISTERS,5).map(([t,h])=>({t,sent:true,tw:true,sub:'Suoni da allenare: '+h}));
  if(cfg.mode==='suoni'){const gs=cfg.snd&&cfg.snd!=='mix'?SOUNDS.filter(g=>g[0]===cfg.snd):SOUNDS;const out=[];
    for(let k=0;k<8;k++){const g=gs[k%gs.length];const i=rint(0,g[3].length-1),w=g[3][i];if(out.some(x=>x.t===w)){k--;if(out.length>=g[3].length*gs.length)break;continue;}
      const pair=g[0]==='doppie'?g[3][i^1]:null;const lw=LEXM[w];out.push({t:w,em:lw?lw.em:'',sub:pair?`Attenzione: non «${pair}»!`:g[1],strict:!!pair,word:lw?w:null});}return out;}
  if(cfg.mode==='lista'){const l=S.lists.find(x=>x.id===S.curList);if(l)return sample(l.items,Math.min(8,l.items.length)).map(x=>({t:x.it,en:x.en,sent:/\s/.test(x.it)&&x.it.split(' ').length>3,word:null}));}
  return sample(LEX.filter(w=>w.em&&w.lv<=L),8).map(w=>({t:w.it,em:w.em,sub:Art.full(w,false),en:w.en,word:w.it}));}

SCR.ecogioco={lay:'side',title:'Eco del Genio',music:'silenzio',pose:'listen',magic:'#ffb35a',back(){go('eco');},leave(){Rec.abort();Rec2.off();Snd.Voice.stop();},
 enter(m,cfg){cfg=cfg||{mode:'parole'};Genie.show(true);Stage.base('listen');const items=ecoItems(cfg);if(!items.length){go('eco');return;}
  Genie.say(Rec.ok()?'Ascolta come lo dico io, poi tocca il microfono e ripeti. Ti ascolto con le mie orecchie magiche!':'Ascolta come lo dico io, poi ripeti ad alta voce: se vuoi, registrati e confronta la tua voce con la mia.',{act:'present',tts:false});
  const st={i:0,best:items.map(()=>0),heard:items.map(()=>''),tried:items.map(()=>false),good:0,fallback:!Rec.ok(),why:''};const voice=Snd.Voice.avail();
  m.innerHTML=`<section class="card"><div class="row sb"><span class="cnt" id="en"></span><span class="pill" id="es"></span></div></section><div id="ea" style="margin-top:12px"></div>`;

  function say(it,slow){Snd.init();Snd.Voice.speak(it.t,{force:true,rate:slow?0.62:0.88});Stage.act('talk',{dur:1.2});}
  function show(){if(st.i>=items.length)return end();hud();const it=items[st.i];const box=$('#ea');Rec.abort();
    box.innerHTML=`<section class="parch q"><div class="qtop"><span class="qskill">${it.tw?'Scioglilingua':it.sent?'Frase':'Parola'}</span><span class="qsub">${st.fallback?'Ascolta, registrati e confronta':'Ascolta, poi tocca il microfono e ripeti'}</span></div>
      ${it.em?`<div class="qpic" aria-hidden="true">${it.em}</div>`:''}<div class="${it.sent?'eco-sent':'eco-word'}">${esc(it.t)}</div>
      ${it.sub?`<p class="mut" style="text-align:center;margin:0">${esc(it.sub)}</p>`:''}${it.en&&S.set.en?`<p class="en" style="text-align:center;margin:0;color:#5a4a7a">${esc(it.en)}</p>`:''}
      ${voice?`<div class="row c"><button class="btn" data-l>${icon('speaker')}<span>Ascolta</span></button><button class="btn ghost" data-ls>${icon('ear')}<span>Più lento</span></button></div>`:`<p class="note" style="margin:0">Su questo dispositivo non c'è una voce italiana: leggi con calma e prova lo stesso.</p>`}
      <div id="ez"></div><div class="eco-heard" id="eh" aria-live="polite"></div><div id="er"></div></section>`;
    if(voice){$('[data-l]',box).onclick=()=>say(it);$('[data-ls]',box).onclick=()=>say(it,true);setTimeout(()=>{if(box.isConnected&&!Rec.busy)say(it);},450);}
    zone();}
  function zone(){const it=items[st.i],z=$('#ez');if(!z)return;
    if(!st.fallback){z.innerHTML=`<button class="mic" data-mic aria-label="Tocca e parla">${icon('mic')}</button><div class="miclab" id="ml">Tocca e parla</div>`;$('[data-mic]',z).onclick=()=>listen(it);return;}
    const can=Rec2.ok();z.innerHTML=`${st.why?`<p class="note" style="margin:0 0 10px">${st.why}</p>`:''}${can?`<div class="row c"><button class="btn gold" data-rec>${icon('mic')}<span>Registra</span></button><button class="btn" data-pl ${Rec2.has?'':'disabled'}>${icon('play')}<span>Riascoltati</span></button></div>`:''}
      <p class="mut" style="text-align:center;margin:10px 0 6px">${can?'Confronta la tua voce con quella del Genio. Com\'è andata?':'Ripeti ad alta voce dopo il Genio. Com\'è andata?'}</p><div class="row c"><button class="btn red" data-sr="0">${icon('refresh')}<span>Da rifare</span></button><button class="btn green" data-sr="1">${icon('check')}<span>Detta bene!</span></button></div>`;
    const rb=$('[data-rec]',z);if(rb)rb.onclick=async()=>{if(Rec2.rec){await Rec2.stop();Snd.duck(false);zone();Rec2.play();return;}
      try{Snd.Voice.stop();await Rec2.start();Snd.duck(true);rb.classList.remove('gold');rb.classList.add('red');$('span',rb).textContent='Ferma';Stage.act('listen');}catch(e){toast(`${icon('mic')}<div>Non posso usare il microfono: controlla i permessi del browser.</div>`,'bad',4000);}};
    const pb=$('[data-pl]',z);if(pb)pb.onclick=()=>Rec2.play();
    $$('[data-sr]',z).forEach(b=>b.onclick=()=>{if(Rec2.rec){Rec2.stop();Snd.duck(false);}const ok=b.dataset.sr==='1';result(ok?0.9:0.3,null,ok?'self':'selfko');});}
  let lt=0,st2=0;const reset=()=>{clearTimeout(lt);clearTimeout(st2);Snd.duck(false);const mic=$('[data-mic]'),ml=$('#ml');if(mic){mic.classList.remove('on');mic.setAttribute('aria-label','Tocca e parla');}if(ml)ml.textContent='Tocca e parla';};
  function listen(it){if(Rec.busy){Rec.stop();clearTimeout(st2);st2=setTimeout(()=>{if(Rec.busy){Rec.abort();}reset();},1500);return;}Snd.Voice.stop();const mic=$('[data-mic]'),ml=$('#ml'),eh=$('#eh');clearTimeout(lt);
    const quiet=()=>{clearTimeout(lt);lt=setTimeout(()=>{if(!Rec.busy)return;Rec.abort();reset();toast(`${icon('ear')}<div>Non ti ho sentito: avvicinati al microfono e riprova.</div>`,'',3200);},10000);};
    let started=false;clearTimeout(st2);st2=setTimeout(()=>{if(started||!Rec.busy)return;Rec.abort();reset();st.why='Il microfono non risponde. Possiamo allenarci così:';st.fallback=true;zone();},15000);
    const r=Rec.listen({onStart:()=>{started=true;clearTimeout(st2);quiet();},onInterim:t=>{started=true;clearTimeout(st2);clearTimeout(lt);if(eh)eh.textContent=t?'«'+t+'…»':'';},
      onError:code=>{clearTimeout(lt);if(code==='aborted')return;if(code==='no-speech'){toast(`${icon('ear')}<div>Non ti ho sentito: avvicinati al microfono e riprova.</div>`,'',3200);return;}
        st.why=code==='not-allowed'||code==='service-not-allowed'?'Il Genio non ha il permesso di usare il microfono. Puoi darglielo nelle impostazioni del sito, oppure continuare così:':code==='network'?'Per riconoscere la voce serve internet. Senza connessione possiamo allenarci così:':code==='audio-capture'?'Non trovo nessun microfono. Possiamo allenarci così:':'Il riconoscimento della voce non è disponibile. Possiamo allenarci così:';

        let best={score:-1};for(const a of alts){const r2=ecoScore(it.t,a,it.strict);if(r2.score>best.score)best=Object.assign(r2,{heard:a});}result(best.score,best);}});
    if(r){Snd.duck(true);if(mic){mic.classList.add('on');mic.setAttribute('aria-label','Ferma l\'ascolto');}if(ml)ml.textContent='Ti ascolto… tocca per fermare';if(eh)eh.textContent='';Stage.act('listen');}}
  function result(score,r,self){const it=items[st.i],first=st.best[st.i]<0.9;st.best[st.i]=Math.max(st.best[st.i],score);if(r)st.heard[st.i]=r.heard;const er=$('#er');if(!er)return;
    const lvl=score>=0.9?'ok':score>=0.6?'mid':'ko';const pct=Math.round(score*100);

    let h=self?`<div class="eco-score ${self==='self'?'ok':'ko'}">${msg}</div>`:`<div class="meter"><i style="--p:${pct}%"></i></div><div class="eco-score ${lvl}">${pct}% · ${msg}</div>`;
    if(r){h+=`<div class="eco-words" style="margin-top:6px">${ecoWords(it.t,r.marks)}</div><p class="mut" style="text-align:center;margin:6px 0 0"><small>Ho sentito: «${esc(r.heard)}»</small></p>`;
      if(it.strict&&score<0.9){const pair=SOUNDS[0][3][SOUNDS[0][3].indexOf(it.t)^1];if(pair&&ecoNorm(r.heard).split(' ').includes(ecoNorm(pair)))h+=`<p class="fbexp">Ho capito «${esc(pair)}»: ${it.t.length>pair.length?'allunga e rinforza la doppia!':'qui la consonante è semplice, non doppia!'}</p>`;}}
    h+=`<div class="row c" style="margin-top:10px">${self?'':`<button class="btn ghost" data-again>${icon('refresh')}<span>Riprova</span></button>`}<button class="btn gold" data-n>${icon('next')}<span>${st.i+1>=items.length?'Fine':'Avanti'}</span></button></div>`;er.innerHTML=h;
    if(score>=0.9&&first){st.good++;addXP(it.tw?6:3);S.st.eco=(S.st.eco||0)+1;award('eco1');if(S.st.eco>=50)award('eco50');if(it.tw)award('lingua');ev('eco',1);Snd.fx('ok');FX.confetti(it.tw?60:20);Stage.act(rnd(['cheer','happy','nod']),{dur:1.2});buzz(15);

    else if(score<0.9){Snd.fx(score>=0.6?'tap':'ko');Stage.act(score>=0.6?'think':'shrug',{dur:1});if(!st.tried[st.i]&&!self)answered(false,'eco',it.word);}

    const ag=$('[data-again]',er);if(ag)ag.onclick=()=>{er.innerHTML='';listen(it);};$('[data-n]',er).onclick=()=>{st.i++;show();};

  function end(){Rec.abort();Rec2.off();const avg=st.best.reduce((a,x)=>a+x,0)/items.length,pct=Math.round(avg*100),gems=Math.round(avg*12);addGems(gems);addXP(8);award('primo');save();

     <div class="row c" style="margin-top:14px"><button class="btn gold" data-re>${icon('refresh')}<span>Ancora</span></button><button class="btn" data-ch>${icon('mic')}<span>Cambia esercizio</span></button><button class="btn ghost" data-h>${icon('home')}<span>Mappa</span></button></div></section>`;

  ["Sofia ride.","«Va bene, allora insegnami una parola nuova ogni giorno!»","Da quel giorno Sofia e Gennaro sono amici."]],
 en:["Sofia is ten years old and lives in an old house in the countryside. One day it rains and Sofia goes up to the attic. In the attic there are boxes, old books and lots of dust.",
  "In a box there is a golden lamp. It is dirty, so Sofia takes a cloth and cleans it. Suddenly some blue smoke comes out and… a genie appears!",
  "«Hello! I am Gennaro, the Genie of the Lamp», says the genie. «Thank you! Can you grant three wishes?» asks Sofia. «No, I'm sorry», answers Gennaro. «I don't grant wishes: I teach Italian!»",
  "Sofia laughs. «All right, then teach me a new word every day!» From that day on, Sofia and Gennaro are friends."],

{id:'venezia',lv:2,em:'🎭',bc:'#1f5a8a',t:'Una gita a Venezia',d:'Due amici, una mappa che non funziona e un caffè carissimo.',
 p:[["La settimana scorsa Giulia e il suo amico Tom, uno studente inglese, sono andati a Venezia in treno.","Sono partiti da Bologna alle otto e sono arrivati alla stazione di Santa Lucia due ore dopo."],
  ["Prima hanno visitato Piazza San Marco e hanno visto la basilica e il campanile.","Poi hanno preso un caffè in un bar storico della piazza, ma hanno pagato dodici euro: carissimo!"],
  ["Nel pomeriggio si sono persi tra le calli, le strette strade di Venezia.","Ogni strada sembrava uguale e la mappa sul telefono non funzionava.","Alla fine una signora anziana li ha aiutati: «Seguite le frecce gialle per Rialto!»"],
  ["La sera hanno fatto un giro in gondola.","Tom ha detto: «Venezia è la città più bella del mondo».","Giulia ha risposto: «Lo so. Ma la prossima volta il caffè lo prendiamo in piedi, al banco!»"]],
 en:["Last week Giulia and her friend Tom, an English student, went to Venice by train. They left Bologna at eight and arrived at Santa Lucia station two hours later.",
  "First they visited St Mark's Square and saw the basilica and the bell tower. Then they had a coffee in a historic café in the square, but they paid twelve euros: very expensive!",
  "In the afternoon they got lost in the calli, the narrow streets of Venice. Every street looked the same and the map on the phone didn't work. In the end an elderly lady helped them: «Follow the yellow arrows to Rialto!»",
  "In the evening they took a gondola ride. Tom said: «Venice is the most beautiful city in the world». Giulia answered: «I know. But next time we'll have our coffee standing at the counter!» (In Italy, coffee at the counter costs much less.)"],

{id:'pizza',lv:2,em:'🍕',bc:'#c8402a',t:'La pizza del nonno',d:"Farina, pazienza e cinquant'anni di pratica.",
 p:[["Il nonno di Marco faceva il pizzaiolo a Napoli.","Oggi ha ottant'anni, ma la domenica prepara ancora la pizza per tutta la famiglia.","Questa volta Marco vuole imparare."],
  ["«Prima di tutto, lavati le mani!» dice il nonno.","«Poi metti la farina sul tavolo, fai un buco al centro e versa l'acqua tiepida con il lievito e un po' di sale.»"],
  ["Marco impasta per dieci minuti.","«Nonno, sono stanco!»","«Non fermarti! L'impasto deve diventare liscio e morbido.","Adesso lo copriamo e aspettiamo: deve riposare almeno sei ore.»"],
  ["La sera stendono l'impasto con le mani, mai con il mattarello.","Mettono il pomodoro, la mozzarella e una foglia di basilico.","Il forno è caldissimo: dopo novanta secondi la pizza è pronta."],
  ["Marco assaggia la sua prima pizza.","«È buona, ma la tua è più buona, nonno!»","Il nonno ride: «Il segreto è la pazienza. E cinquant'anni di pratica!»"]],
 en:["Marco's grandfather used to be a pizza maker in Naples. Today he is eighty, but on Sundays he still makes pizza for the whole family. This time Marco wants to learn.",
  "«First of all, wash your hands!» says Grandpa. «Then put the flour on the table, make a hole in the middle and pour in the lukewarm water with the yeast and a little salt.»",
  "Marco kneads for ten minutes. «Grandpa, I'm tired!» «Don't stop! The dough must become smooth and soft. Now we cover it and wait: it has to rest for at least six hours.»",
  "In the evening they stretch the dough with their hands, never with a rolling pin. They add tomato, mozzarella and a basil leaf. The oven is very hot: after ninety seconds the pizza is ready.",
  "Marco tastes his first pizza. «It's good, but yours is better, Grandpa!» Grandpa laughs: «The secret is patience. And fifty years of practice!»"],
