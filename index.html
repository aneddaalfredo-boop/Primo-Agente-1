{id:'firenze',lv:2,em:'🚆',bc:'#8a5d17',t:'Un biglietto per Firenze',d:'Una sveglia che non suona e un viaggio tra le colline.',
 p:[["Ahmed vive in Italia da tre mesi.","Sabato vuole visitare Firenze con la sua amica Chiara, così venerdì sera va alla stazione per comprare i biglietti."],
  ["«Buonasera. Due biglietti per Firenze, per favore.»","«Andata e ritorno?» chiede l'impiegata.","«Sì, andata e ritorno. A che ora parte il primo treno?»","«Alle sette e venti, dal binario quattro. Arriva a Firenze alle nove meno un quarto.»"],
  ["Sabato mattina la sveglia di Ahmed non suona e lui arriva in ritardo: il treno delle sette e venti è già partito!","Chiara lo aspetta sul binario.","«Non preoccuparti», dice.","«Prendiamo il treno delle otto. Ma prima facciamo colazione al bar!»"],
  ["Il viaggio è tranquillo.","Ahmed guarda dal finestrino le colline della Toscana, piene di ulivi e di cipressi.","«Che bello!» dice.","«La prossima volta metto due sveglie!»"]],
 en:["Ahmed has been living in Italy for three months. On Saturday he wants to visit Florence with his friend Chiara, so on Friday evening he goes to the station to buy the tickets.",
  "«Good evening. Two tickets to Florence, please.» «Return?» asks the clerk. «Yes, return. What time does the first train leave?» «At twenty past seven, from platform four. It arrives in Florence at a quarter to nine.»",
  "On Saturday morning Ahmed's alarm doesn't go off and he arrives late: the 7:20 train has already left! Chiara is waiting for him on the platform. «Don't worry», she says. «Let's take the eight o'clock train. But first let's have breakfast at the café!»",
  "The journey is peaceful. Ahmed looks out of the window at the hills of Tuscany, full of olive trees and cypresses. «How beautiful!» he says. «Next time I'll set two alarms!»"],

{id:'topolino',lv:3,em:'🐭',bc:'#4a2a6a',t:'Il mistero della biblioteca',d:'Ogni notte sparisce un libro. Chi è il ladro?',
 p:[["Nella biblioteca della torre succedeva una cosa strana: ogni notte spariva un libro.","Il bibliotecario, il vecchio signor Ugo, era molto preoccupato.","«Prima è sparito un dizionario, poi un libro di poesie, ieri addirittura un'enciclopedia!»"],
  ["Gennaro ha deciso di indagare.","Una sera si è nascosto dietro uno scaffale e ha aspettato in silenzio.","Verso mezzanotte ha sentito un rumore leggero, come un fruscio di pagine.","Ha acceso la sua lampada e ha visto… un topolino che trascinava un libro verso un buco nel muro!"],
  ["Il genio l'ha seguito e ha scoperto una piccola stanza segreta.","Dentro c'erano tutti i libri scomparsi, sistemati con cura uno accanto all'altro.","In mezzo, il topolino leggeva con un paio di occhiali minuscoli sul naso."],
  ["«Scusate», ha detto il topolino, tutto rosso.","«Mi chiamo Bartolo. Volevo imparare a leggere, ma nessuno presta i libri ai topi.»","Il signor Ugo, invece di arrabbiarsi, è scoppiato a ridere."],
  ["Da quel giorno Bartolo ha una tessera della biblioteca tutta sua.","La usa ogni sera e, quando trova una parola difficile, chiede aiuto a Gennaro."]],
 en:["In the tower library something strange was happening: every night a book disappeared. The librarian, old Mr Ugo, was very worried. «First a dictionary disappeared, then a book of poems, yesterday even an encyclopedia!»",
  "Gennaro decided to investigate. One evening he hid behind a bookshelf and waited in silence. Around midnight he heard a faint noise, like a rustle of pages. He lit his lamp and saw… a little mouse dragging a book towards a hole in the wall!",
  "The genie followed it and discovered a small secret room. Inside were all the missing books, carefully arranged side by side. In the middle, the little mouse was reading with a pair of tiny glasses on its nose.",
  "«Sorry», said the mouse, blushing all over. «My name is Bartolo. I wanted to learn to read, but nobody lends books to mice.» Mr Ugo, instead of getting angry, burst out laughing.",
  "Since that day Bartolo has a library card all of his own. He uses it every evening and, when he finds a difficult word, he asks Gennaro for help."],

{id:'lettera',lv:3,em:'✉️',bc:'#a8243a',t:'Lettera da Bologna',d:'Uno studente racconta i suoi primi mesi in Italia.',
 p:[["Cara Emma,","ti scrivo da Bologna, dove studio ormai da sei mesi.","Scusami se non ti ho risposto prima, ma qui le giornate volano!"],
  ["All'inizio è stato difficile: capivo poco quando la gente parlava velocemente.","Una volta, al supermercato, ho chiesto «un chilo di prosciutto» invece di un etto, e il commesso mi ha guardato come se fossi matto!"],
  ["Adesso va molto meglio.","Abito con due ragazze, Giada e Irene, che mi correggono sempre con pazienza.","La sera cuciniamo insieme: loro mi hanno insegnato a fare i tortellini, io ho insegnato loro a fare il curry."],
  ["Bologna è una città stupenda.","Ha chilometri di portici, così puoi camminare all'asciutto anche quando piove.","E poi si mangia benissimo: non per niente la chiamano «la Grassa»!"],
  ["Mi piacerebbe tanto che tu venissi a trovarmi in primavera.","Potremmo fare una gita a Ravenna per vedere i mosaici, oppure salire sulla Torre degli Asinelli: dicono che dalla cima, quando il cielo è limpido, si vedano le Alpi.","Scrivimi presto!","Un abbraccio, Daniel"]],
 en:["Dear Emma, I'm writing to you from Bologna, where I've been studying for six months now. Sorry I didn't answer you sooner, but here the days fly by!",
  "At the beginning it was hard: I understood little when people spoke quickly. Once, at the supermarket, I asked for «a kilo of ham» instead of a hundred grams, and the shop assistant looked at me as if I were crazy!",
  "Now it's much better. I live with two girls, Giada and Irene, who always correct me patiently. In the evening we cook together: they taught me how to make tortellini, I taught them how to make curry.",
  "Bologna is a wonderful city. It has kilometres of porticoes, so you can walk without getting wet even when it rains. And the food is excellent: it's not for nothing that they call it «the Fat One»!",
  "I would really love you to come and visit me in spring. We could take a trip to Ravenna to see the mosaics, or climb the Asinelli Tower: they say that from the top, when the sky is clear, you can see the Alps. Write to me soon! A hug, Daniel"],

  ["Che cosa hanno insegnato a Daniel Giada e Irene?","A fare i tortellini","A fare il curry","A guidare la macchina","A suonare la chitarra"],["Perché a Bologna si può camminare all'asciutto quando piove?","Perché ci sono chilometri di portici","Perché non piove quasi mai","Perché ci sono molti autobus","Perché tutti hanno l'ombrello"],

{id:'sagra',lv:3,em:'🎆',bc:'#2a4fb0',t:'La festa del paese',d:'Una sagra, un vecchio amico e le radici che non si dimenticano.',
 p:[["Ogni anno, il primo sabato di settembre, il piccolo paese di Roccalta festeggia la sagra della lenticchia.","Quando Elena era bambina, la aspettava per mesi: c'erano le giostre, la banda musicale e i fuochi d'artificio sopra la valle."],
  ["Poi Elena è andata a lavorare a Milano e per molti anni non è più tornata.","Quest'anno, però, sua madre l'ha chiamata: «Il comitato della sagra cerca volontari. Perché non vieni a darci una mano?»"],
  ["Elena ha accettato quasi senza pensarci.","Il venerdì ha aiutato a montare i tavoli in piazza; il sabato ha servito più di trecento piatti di zuppa di lenticchie.","Alla fine della serata era stanchissima, ma felice."],
  ["Mentre guardava i fuochi d'artificio, ha incontrato Paolo, il suo vecchio compagno di banco.","«Ti ricordi quando abbiamo rotto la finestra della scuola con il pallone?» le ha chiesto ridendo.","«Come potrei dimenticarlo? L'abbiamo ripagata con la nostra paghetta per tre mesi!»"],
  ["Quella notte Elena ha capito una cosa: si può vivere lontano, ma le radici restano sempre lì, ad aspettarti."]],
 en:["Every year, on the first Saturday of September, the small village of Roccalta celebrates its lentil festival. When Elena was a child, she looked forward to it for months: there were fairground rides, the brass band and fireworks over the valley.",
  "Then Elena went to work in Milan and for many years she never went back. This year, however, her mother called her: «The festival committee is looking for volunteers. Why don't you come and give us a hand?»",
  "Elena accepted almost without thinking. On Friday she helped set up the tables in the square; on Saturday she served more than three hundred bowls of lentil soup. At the end of the evening she was exhausted, but happy.",
  "While she was watching the fireworks, she met Paolo, her old deskmate. «Do you remember when we broke the school window with the ball?» he asked her, laughing. «How could I forget? We paid for it with our pocket money for three months!»",
  "That night Elena understood something: you can live far away, but your roots always stay there, waiting for you."],

  ["Che cosa ha capito Elena alla fine?","Che le radici restano sempre","Che Milano è più bella","Che non vuole più lavorare","Che non le piacciono le lenticchie"]]},
{id:'genio',lv:4,em:'🧞',bc:'#5b2a92',t:'Il genio che non voleva esaudire desideri',d:'La vera storia di Gennaro, raccontata come una fiaba.',
 p:[["Tanto tempo fa, in una città d'Oriente, viveva un genio di nome Gennaro.","Come tutti i geni, avrebbe dovuto esaudire tre desideri a chiunque strofinasse la sua lampada.","Eppure, ogni volta che qualcuno lo liberava, Gennaro si sentiva profondamente insoddisfatto."],
  ["Il primo padrone gli chiese un palazzo d'oro, e lo ottenne; ma vi si annoiò dopo una settimana.","Il secondo volle diventare l'uomo più ricco del regno, e lo diventò; ma da quel momento non si fidò più di nessuno.","Il terzo desiderò che tutti lo ammirassero, e così fu; ma nessuno, in realtà, gli voleva bene."],
  ["«Se avessi dato loro qualcosa di diverso», pensava Gennaro, «forse sarebbero stati più felici.»","Così, un giorno, prese una decisione che nessun genio aveva mai preso prima: smise di esaudire desideri."],
  ["Da allora, a chi strofina la lampada, Gennaro offre un dono diverso: una parola nuova al giorno.","«Le parole», spiega, «non si consumano come l'oro e non fanno invidia a nessuno. Al contrario: più le regali, più ne hai.»"],
  ["C'è chi resta deluso e chi, invece, comincia ad ascoltarlo.","E pare che questi ultimi, dopo qualche tempo, non sentano più il bisogno di chiedere nient'altro."]],
 en:["Long ago, in a city of the East, there lived a genie called Gennaro. Like all genies, he was supposed to grant three wishes to anyone who rubbed his lamp. And yet, every time someone set him free, Gennaro felt deeply dissatisfied.",
  "His first master asked him for a golden palace, and he got it; but he grew bored there within a week. The second wanted to become the richest man in the kingdom, and he did; but from that moment on he never trusted anyone again. The third wished that everyone would admire him, and so it was; but nobody truly loved him.",
  "«If I had given them something different», Gennaro thought, «perhaps they would have been happier.» So, one day, he made a decision that no genie had ever made before: he stopped granting wishes.",
  "Since then, to whoever rubs the lamp, Gennaro offers a different gift: one new word a day. «Words», he explains, «don't wear out like gold and make nobody envious. On the contrary: the more you give them away, the more you have.»",
  "Some people are disappointed, and some, instead, begin to listen to him. And it seems that the latter, after a while, no longer feel the need to ask for anything else."],

  VERBS.forEach(v=>{const x={k:'v:'+v.inf,t:v.inf,en:v.en};add(v.inf,x);try{Conj.allForms(v).forEach(f=>add(f,x));}catch(e){}});

  const tries=[t,t.replace(/^[a-zà-ù]+'/,''),t.replace(/'$/,'')].filter((x,i,a)=>x&&a.indexOf(x)===i);
  for(const k in s.g)if(k.includes(' ')&&low.includes(k)&&k.split(/[\s']+/).some(w=>tries.includes(w)||tries.includes(w+"'")))push('g:'+k,`<b>${esc(k)}</b>${en?' = '+esc(s.g[k]):''}`);

    while(x<150){const w=9+Math.random()*13,h=62+Math.random()*34;if(x+w>158)break;const c=BC[(Math.random()*BC.length)|0];s+=`<rect x="${x.toFixed(1)}" y="${(y+100-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="1.5" fill="${c}"/><rect x="${x.toFixed(1)}" y="${(y+100-h+8).toFixed(1)}" width="${w.toFixed(1)}" height="3" fill="#b8862b" opacity=".45"/>`;x+=w+1.5;}}g.innerHTML=s;});
  // parallasse leggera: si sposta l'intera scena come un unico strato, senza ridisegnarla
  const scn=$('#scene');
  if(matchMedia('(pointer:fine)').matches&&!matchMedia('(prefers-reduced-motion: reduce)').matches)addEventListener('pointermove',e=>{if(document.body.classList.contains('calm'))return;const dx=e.clientX/innerWidth-0.5,dy=e.clientY/innerHeight-0.5;scn.style.transform=`translate3d(${(-dx*16).toFixed(1)}px,${(-dy*9).toFixed(1)}px,0)`;},{passive:true});
  // motore 3D, particelle
  const ok=Stage.init($('#gl'));if(!ok)document.body.classList.add('no3d');
  FX.init($('#fx'));Amb.init($('#amb'));Stage.slots($('#gslot'),$('#eslot'));
  const g2=$('#g2d');let g2t=0;
  Stage.onFrame((dt,T)=>{FX.update(dt);Amb.update(dt);
    if(document.body.classList.contains('no3d')&&T-g2t>0.2){g2t=T;const r=$('#gslot').getBoundingClientRect();const h=Math.min(r.height,r.width*1.9),w=h/1.9;g2.style.left=(r.left+(r.width-w)/2)+'px';g2.style.top=(r.top+(r.height-h)/2)+'px';g2.style.width=w+'px';g2.style.height=h+'px';
      g2.style.opacity=Stage.vis>0.3||document.body.dataset.lay!=='title'?1:0.15;}});
  Stage.start();
  setTimeout(()=>{const st=Stage.stats();if(!st.ok||st.failed.includes('0'))document.body.classList.add('no3d');},9000);
  // barra superiore
  $('#tback').onclick=()=>{Snd.fx('click');back();};$('#thome').onclick=()=>{Snd.fx('click');if(document.body.dataset.scr!=='title')go('hub');};
  $('#gemc').onclick=()=>go('bazar');$('#lvring').onclick=()=>go('stats');
  $('#strc').onclick=()=>toast(`${icon('flame')}<div><b>${S.streak.n||0} giorni di fila</b><br><small>Studia ogni giorno per tenere accesa la fiamma.</small></div>`);
  $('#tmus').onclick=()=>{Snd.init();S.set.music=S.set.music>0?0:0.5;Snd.setVol('music',S.set.music);save();refreshTop();};
  $('#tvoice').onclick=()=>{S.set.voice=!S.set.voice;Snd.Voice.on=S.set.voice;if(!S.set.voice)Snd.Voice.stop();save();refreshTop();toast(`${icon('speaker')}<div>Voce del Genio ${S.set.voice?'attiva':'spenta'}</div>`);};
  $('#tset').onclick=()=>go('impostazioni');
  $('#ghot').onclick=()=>{Snd.init();const h=Stage.scr.head;if(h)FX.spark(h[0],h[1],18,'gold',140,0.8,5);Snd.fx('sparkle');Genie.say(rnd(POKES),{act:rnd(['laugh','surprise','wink','spin'])});};
  addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal').classList.contains('on'))Modal.close();else if(!['hub','title'].includes(document.body.dataset.scr))back();}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)Snd.Voice.stop();});
  // accessibilità: il tasto Tab resta dentro la finestra aperta; il testo inglese viene letto con la pronuncia inglese
  $('#modal').addEventListener('keydown',e=>{if(e.key!=='Tab')return;const f=$$('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),select:not([disabled]),[tabindex]:not([tabindex="-1"])',$('#modal')).filter(x=>x.offsetParent!==null);if(!f.length)return;
    const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}});
  // e i pulsanti a scelta (.seg) dicono ai lettori di schermo quale opzione è attiva
  const syncSeg=b=>b.setAttribute('aria-pressed',b.classList.contains('on'));
  new MutationObserver(ms=>{let added=false;for(const r of ms){if(r.type==='attributes'){if(r.target.matches&&r.target.matches('.seg button'))syncSeg(r.target);}else if(r.addedNodes.length)added=true;}
    if(added){for(const x of document.querySelectorAll('.en:not([lang])'))x.lang='en';for(const b of document.querySelectorAll('.seg button:not([aria-pressed])'))syncSeg(b);}}).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
  // salvataggio immediato quando l'app viene chiusa o messa in secondo piano
  addEventListener('pagehide',saveNow);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow();});
  PWA.init();
  Genie.init();applySettings();refreshTop();missions();
  // aggancio per i collaudi automatici: attivo solo aprendo la pagina con ?debug
  if(/[?&]debug\b/.test(location.search))window.__app={go,back,get S(){return S},SCR,save,QG,QUI,Stage,Snd,FX,LEX,FOES,ROOMS,ev,award,addXP,addGems,Modal,ecoScore,listFromCode,listCode,STORIES,get cur(){return curName}};
  // collegamenti diretti (scorciatoie dell'app installata) e liste condivise dall'insegnante
  const hash=decodeURIComponent((location.hash||'').slice(1)),DEEP=['hub','parola','grimorio','eco','biblioteca','duello','quiz','torre','dettato'];
  const shared=/^lista=/.test(hash)?listFromCode(location.hash):null;if(hash)try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
  if(S.ach.intro&&DEEP.includes(hash)){Stage.lamp(true,0.25);go(hash);}else go('title');
  if(/^lista=/.test(hash)){if(shared)setTimeout(()=>offerSharedList(shared),600);else toast(`${icon('x')}<div>Il link della lista non è valido o è incompleto.</div>`,'bad',4000);}
})();

})();
</script>
</body>
